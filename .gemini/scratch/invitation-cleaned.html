<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aanya &amp; Vihaan · Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Tiro+Devanagari+Hindi&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a2a10;--gold:#b98a35;--cream:#fbf1dc;--night:#120d0a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night);overflow:hidden;touch-action:manipulation}
body{font-family:"Cormorant Garamond","Tiro Devanagari Hindi",Georgia,"Times New Roman",serif;color:var(--cream);-webkit-tap-highlight-color:transparent}
.scene{position:fixed;inset:0;overflow:hidden}
.world{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.bgblur{position:absolute;inset:-8%;background-size:cover;background-position:center;filter:blur(18px) saturate(1.05) brightness(.62);transform:scale(1.08)}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.stage img{position:absolute;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}

/* ---------- Scene 1: the door ---------- */
#s1{cursor:pointer;perspective:1600px}
#s1 .tilt{position:absolute;inset:0;transform-style:flat;will-change:transform}
.interior{position:absolute;left:0;top:0;width:735px;height:983px;overflow:hidden}
.interior .ibg{position:absolute;background-size:cover;background-position:center;filter:blur(14px) brightness(.8)}
.interior .iimg{position:absolute}
.interior .iimg img{width:100%;height:auto;left:0;top:0}
.interior .light{position:absolute;left:150px;top:200px;width:440px;height:780px;
  background:radial-gradient(60% 55% at 50% 55%,#fffdf4 0%,#ffe9b8 35%,#f2c26d 70%,#c98a3a 100%)}
.doors3d{position:absolute;left:0;top:0;width:735px;height:983px;perspective:1150px;perspective-origin:368.5px 600px}
.leaf{position:absolute;top:239px;height:696px;transform-style:preserve-3d;will-change:transform}
.leaf.L{left:194px;width:175px;transform-origin:0 50%}
.leaf.R{left:368px;width:176px;transform-origin:100% 50%}
.leaf img{position:absolute;inset:0;width:100%;height:100%}
.leaf .shade,.leaf .sheen,.leaf .spill{position:absolute;inset:0;pointer-events:none;opacity:0;
  -webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat}
.leaf .shade{background:#1a0d04}
.leaf .sheen{background:linear-gradient(100deg,rgba(255,240,200,0) 35%,rgba(255,244,214,.75) 50%,rgba(255,240,200,0) 65%);background-size:300% 100%;mix-blend-mode:soft-light}
.leaf.L .spill{background:linear-gradient(270deg,rgba(255,226,160,.9),rgba(255,226,160,0) 40%);mix-blend-mode:screen}
.leaf.R .spill{background:linear-gradient(90deg,rgba(255,226,160,.9),rgba(255,226,160,0) 40%);mix-blend-mode:screen}
.leaf .edge{position:absolute;top:0;height:100%;width:10px;background:linear-gradient(90deg,#6b4516,#b88a3e 45%,#7b5220)}
.leaf.L .edge{right:0;transform-origin:100% 50%;transform:rotateY(-90deg)}
.leaf.R .edge{left:0;transform-origin:0 50%;transform:rotateY(90deg)}
.frame{left:0;top:0;width:735px;height:983px}
.rays{position:absolute;left:-120px;top:120px;width:975px;height:900px;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(38% 50% at 50% 55%,rgba(255,226,160,.85),rgba(255,200,120,.25) 55%,rgba(255,200,120,0) 75%)}
.knock{position:absolute;width:46px;height:46px;border-radius:50%;top:612px;pointer-events:none;
  background:radial-gradient(circle,rgba(255,230,160,.55),rgba(255,210,120,0) 70%);mix-blend-mode:screen;animation:pulse 2.6s ease-in-out infinite}
.knock.a{left:314px}.knock.b{left:375px;animation-delay:.25s}
@keyframes pulse{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
.hint{position:absolute;left:0;right:0;bottom:calc(5.5vh + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;
  font-style:italic;font-size:clamp(17px,2.2vh,22px);letter-spacing:.06em;color:#fff6e2;text-shadow:0 1px 2px rgba(0,0,0,.7),0 0 18px rgba(0,0,0,.6);transition:opacity .6s}
.hint span{display:inline-block;padding:.35em 1.1em;border-radius:40px;background:rgba(30,16,8,.38);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.65}50%{opacity:1}}
#s1.opened .hint{opacity:0}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
.flash{position:fixed;inset:0;background:#fff7e3;opacity:0;pointer-events:none;z-index:5}

/* ---------- Scene 2: the palace ---------- */
#s2{visibility:hidden}
#s2.live{visibility:visible}
.lan{position:absolute;will-change:transform}
.lan img{position:relative;width:100%;height:100%}
.lan .chain{position:absolute;bottom:100%;width:2px;height:1200px;
  background:repeating-linear-gradient(180deg,#8a6a3a 0 3px,#c9a765 3px 5px,#5e4424 5px 6px)}
.glow{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,236,170,.75) 0%,rgba(255,214,120,.28) 35%,rgba(255,200,100,0) 70%)}
.names{position:absolute;left:198px;width:340px;top:156px;text-align:center;color:var(--ink);pointer-events:none}
.names .sm{font-style:italic;font-size:15px;letter-spacing:.03em;color:#5a3714;text-shadow:0 0 8px rgba(255,252,240,.95),0 0 2px rgba(255,252,240,.9)}
.names .nm{font-family:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;font-size:60px;line-height:1;white-space:nowrap;
  filter:drop-shadow(0 0 7px rgba(255,251,238,.95)) drop-shadow(0 1px 0 rgba(255,255,255,.7))}
.names .amp{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:34px;line-height:.8;margin:.05em 0 .12em;color:#6f4513;text-shadow:0 0 8px rgba(255,252,240,.95)}
.names .ch{display:inline-block;opacity:0;transform:translateY(-14px) scale(1.08);filter:blur(5px);
  background:linear-gradient(100deg,#3f2008 0%,#6f4513 32%,#c9973f 46%,#f7dc94 50%,#c9973f 54%,#6f4513 68%,#3f2008 100%);
  background-size:400% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;
  transition:opacity 1s ease,transform 1.3s cubic-bezier(.2,.8,.2,1),filter 1.1s ease;padding:.12em .28em;margin:-.12em -.24em}
.names.shine .ch{animation:shine 5.5s ease-in-out infinite}
@keyframes shine{0%,55%{background-position:100% 0}85%,100%{background-position:0 0}}
.names .ch.in{opacity:1;transform:none;filter:none}
.names .ln{opacity:0;transform:translateY(-8px);filter:blur(4px);transition:all 1.3s cubic-bezier(.2,.8,.2,1)}
.names .ln.in{opacity:1;transform:none;filter:none}
.names svg{display:block;margin:8px auto 5px;width:140px;height:16px;overflow:visible}
.names svg path{stroke-dasharray:160;stroke-dashoffset:160;transition:stroke-dashoffset 1.8s ease}
.names svg.in path{stroke-dashoffset:0}
.names .dt{font-size:15.5px;font-weight:600;letter-spacing:.07em;color:#4d2c0f;margin-top:3px;text-shadow:0 0 8px rgba(255,252,240,.95)}

canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ctrl{position:fixed;z-index:6;display:flex;gap:10px;right:calc(14px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px))}
.ctrl button{font:inherit;font-size:15px;font-style:italic;color:#fff5de;background:rgba(28,15,6,.42);border:1px solid rgba(255,228,170,.35);
  border-radius:40px;padding:.4em 1em;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-height:38px}
.ctrl button:focus-visible,#s1:focus-visible{outline:2px solid #ffd98a;outline-offset:3px}
#replay{opacity:0;pointer-events:none;transition:opacity .8s}
#replay.show{opacity:1;pointer-events:auto}


/* ---------- welcome + key ---------- */
.scrim{position:absolute;left:0;right:0;top:0;height:34vh;pointer-events:none;background:linear-gradient(180deg,rgba(20,10,4,.72),rgba(20,10,4,.35) 55%,rgba(20,10,4,0));transition:opacity 1s}
.welcome{position:absolute;left:0;right:0;top:calc(3.2vh + env(safe-area-inset-top,0px));text-align:center;pointer-events:none;color:#fbeac0;transition:opacity 1s,transform 1.4s cubic-bezier(.2,.8,.2,1)}
.welcome .om{font-family:"Tiro Devanagari Hindi","Noto Serif Devanagari",serif;font-size:clamp(14px,2vh,19px);letter-spacing:.08em;color:#f3d58c;opacity:.95}
.welcome .wt{font-family:"Pinyon Script","Tiro Devanagari Hindi","Snell Roundhand",cursive;font-size:min(7.2vh,12.5vw,76px);line-height:1.15;white-space:nowrap;
  background:linear-gradient(100deg,#c99a43 0%,#f7e2a3 35%,#fff8df 50%,#f7e2a3 65%,#c99a43 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.55));animation:wshine 6s ease-in-out infinite}
@keyframes wshine{0%,40%{background-position:100% 0}80%,100%{background-position:0 0}}
.welcome .ws{font-style:italic;font-size:clamp(15px,2.1vh,20px);letter-spacing:.05em;color:#fff3da;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.welcome .ws2{display:block;width:120px;height:12px;margin:.3em auto .2em}
.welcome > *{opacity:0;transform:translateY(-10px);filter:blur(5px);animation:win 1.6s cubic-bezier(.2,.8,.2,1) forwards}
.welcome .om{animation-delay:.3s}.welcome .wt{animation:win 1.8s cubic-bezier(.2,.8,.2,1) .6s forwards,wshine 6s ease-in-out 2.5s infinite}.welcome .ws2{animation-delay:1.3s}.welcome .ws{animation-delay:1.5s}
@keyframes win{to{opacity:1;transform:none;filter:none}}
#s1.unlocking .welcome{opacity:0;transform:translateY(-30px)}
#s1.unlocking .scrim{opacity:0}
.lockplate{position:absolute;left:342px;top:686px;width:53px;height:100px;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(40,20,0,.55));transition:opacity .6s}
.seam{position:absolute;left:365px;top:239px;width:7px;height:695px;transform-origin:50% 70%;transform:scaleY(0);pointer-events:none;border-radius:4px;mix-blend-mode:screen;
  background:linear-gradient(180deg,rgba(255,236,180,0),#fff6d8 20%,#fffdf2 70%,#fff6d8 88%,rgba(255,236,180,0));box-shadow:0 0 18px 6px rgba(255,214,130,.8),0 0 60px 18px rgba(255,200,110,.45)}
#key{position:absolute;left:0;top:0;width:60px;height:176px;transform-origin:30px 0;touch-action:none;cursor:grab;z-index:3;will-change:transform}
#key.drag{cursor:grabbing}
#key .kin{position:absolute;inset:0;transform-origin:30px 30px}
#key svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 8px rgba(30,15,0,.55))}
#key .halo{position:absolute;left:-40px;top:70px;width:140px;height:140px;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,226,150,.55),rgba(255,210,120,0) 65%);animation:pulse 2.4s ease-in-out infinite}
/* couple venue */
.cvenue{position:absolute;left:198px;width:340px;top:706px;text-align:center}
.cvenue svg{display:block;margin:0 auto 6px;width:150px;height:14px}
.cvenue .vl{font-style:italic;font-size:18px;color:#8a5a4a}
.cvenue .vn{font-size:23px;font-weight:600;color:#5b2f25;letter-spacing:.02em;line-height:1.25}
.cvenue .va{font-style:italic;font-size:18.5px;color:#6a3a2c;line-height:1.3}
/* countdown v2: jharokha split-flap cards over a turning mandala */
.mand{position:absolute;left:118px;top:268px;width:500px;height:500px;pointer-events:none}
.mand .rot{transform-origin:250px 250px}
.mand .tk{stroke:#b08238;stroke-width:1.3;opacity:.35}
.mand .tk.on{opacity:1;stroke:#d9a64a;stroke-width:3}
.cd{position:absolute;left:112px;width:512px;top:440px;display:flex;justify-content:space-between}
.card{position:relative;width:116px}
.card .fl{position:relative;width:116px;height:136px;perspective:400px;
  clip-path:path('M0,136 L0,40 C0,16 38,10 58,0 C78,10 116,16 116,40 L116,136 Z')}
.fl .h{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:linear-gradient(180deg,#fffaf0,#f6e6cc);backface-visibility:hidden}
.fl .h span{position:absolute;left:0;right:0;height:136px;line-height:136px;text-align:center;font-size:60px;font-weight:600;color:#5b2f25;font-variant-numeric:lining-nums tabular-nums}
.fl .t{top:0}.fl .b{bottom:0;background:linear-gradient(180deg,#f1dcbd,#fbf2e2)}
.fl .b span{bottom:0}
.fl .ft{top:0;transform-origin:50% 100%;z-index:2}
.fl .fb{bottom:0;transform-origin:50% 0;z-index:2;transform:rotateX(90deg);background:linear-gradient(180deg,#f1dcbd,#fbf2e2)}
.fl .fb span{bottom:0}
.fl.go .ft{animation:ft .32s ease-in forwards}
.fl.go .fb{animation:fb .32s ease-out .32s forwards}
@keyframes ft{to{transform:rotateX(-90deg);filter:brightness(.75)}}
@keyframes fb{from{transform:rotateX(90deg);filter:brightness(1.2)}to{transform:rotateX(0)}}
.fl .ft,.fl .fb{visibility:hidden}
.fl.go .ft,.fl.go .fb{visibility:visible}
.fl .mid{position:absolute;left:0;right:0;top:50%;height:1.5px;margin-top:-.75px;background:rgba(90,50,20,.35);z-index:3}
.fl.three .h span{font-size:48px}
.card svg.cb{position:absolute;left:-5px;top:-5px;width:126px;height:146px;pointer-events:none;overflow:visible}
.card .lb{text-align:center;font-style:italic;font-size:18px;color:#6a3a2c;margin-top:8px}
.card .gem{position:absolute;left:52px;top:-17px;width:12px;height:12px;transform:rotate(45deg);background:linear-gradient(135deg,#f6de9a,#b08238);box-shadow:0 0 8px rgba(255,210,120,.9)}
/* ---------- Scene 3/4: the floral arch ---------- */
#s3{visibility:hidden;opacity:0}
#s3.live{visibility:visible}
.t3{position:absolute;left:0;top:0;width:736px;height:1307px;transform-origin:0 0;pointer-events:none;color:#5b2f25}
.pg{position:absolute;inset:0;will-change:transform,opacity}
.gl3{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;mix-blend-mode:screen;pointer-events:none;
  background:radial-gradient(circle,rgba(255,226,160,.8),rgba(255,205,130,.25) 38%,rgba(255,200,120,0) 70%)}
.fade{opacity:0;transform:translateY(14px);filter:blur(5px);transition:opacity 1.2s ease var(--d,0s),transform 1.4s cubic-bezier(.2,.8,.2,1) var(--d,0s),filter 1.2s ease var(--d,0s)}
.on .fade{opacity:1;transform:none;filter:none}
.soft{text-shadow:0 0 10px rgba(255,251,244,.95),0 0 3px rgba(255,251,244,.9)}
/* couple portrait */
.cframe{position:absolute;left:213px;top:128px;width:310px;height:440px;pointer-events:auto;cursor:pointer}
.cframe .ph{position:absolute;inset:10px;clip-path:path('M0,420 L0,128 C0,58 98,44 145,0 C192,44 290,58 290,128 L290,420 Z');overflow:hidden;
  clip-path:path('M0,420 L0,128 C0,58 98,44 145,0 C192,44 290,58 290,128 L290,420 Z')}
.cframe .rv{position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 35%,#fbeee6,#efd3c8 70%,#e3bfb2);clip-path:inset(100% 0 0 0);transition:clip-path 2.2s cubic-bezier(.6,0,.2,1) .7s}
.on .cframe .rv{clip-path:inset(0 0 0 0)}
.cframe img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;position:absolute;inset:0;transform:scale(1.12);transition:transform 6s cubic-bezier(.2,.8,.2,1) .7s}
.on .cframe img{transform:scale(1)}
.cframe .gleam{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,248,225,.55) 50%,rgba(255,255,255,0) 65%);background-size:300% 100%;background-position:100% 0;mix-blend-mode:soft-light}
.on .cframe .gleam{animation:gleam 2.4s ease 2.6s both}
@keyframes gleam{to{background-position:0 0}}
.cframe .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:40px;color:#8a5a4a;font-style:italic;font-size:21px;line-height:1.3}
.cframe .empty svg{width:44px;height:44px;opacity:.7}
.cframe svg.bd{position:absolute;inset:0;width:310px;height:440px;overflow:visible;pointer-events:none}
.cframe svg.bd path{fill:none;stroke-dasharray:1400;stroke-dashoffset:1400;transition:stroke-dashoffset 2.6s cubic-bezier(.4,0,.2,1) .2s}
.on .cframe svg.bd path{stroke-dashoffset:0}
.cnames{position:absolute;left:163px;top:586px;width:410px;display:grid;grid-template-columns:1fr 40px 1fr;align-items:start;text-align:center}
.cnames .n{font-family:"Pinyon Script","Tiro Devanagari Hindi","Snell Roundhand",cursive;font-size:52px;line-height:1.1;color:#6a3322;white-space:nowrap}
.cnames .amp{font-style:italic;font-size:34px;padding-top:12px;color:#a8793a}
.cnames .of{font-style:italic;font-size:18px;color:#7a4a38;margin-top:4px}
.cnames .fa{font-size:19px;font-weight:600;letter-spacing:.03em;color:#5b2f25;line-height:1.25}
/* save the date */
.sd{position:absolute;left:88px;width:560px;top:120px;text-align:center}
.sd .t{font-family:"Pinyon Script","Tiro Devanagari Hindi",cursive;font-size:66px;line-height:1.1;color:#6a3322}
.sd .day{font-style:italic;font-size:24px;color:#8a5a4a;margin-top:6px}
.sd .date{font-size:48px;font-weight:600;letter-spacing:.02em;color:#5b2f25;line-height:1.1}
.sd .time{font-size:22px;color:#6a3a2c;margin-top:12px;line-height:1.45}
.sd svg{display:block;margin:14px auto 4px;width:180px;height:16px}
.cdl{position:absolute;left:88px;width:560px;top:652px;text-align:center;font-style:italic;font-size:21px;color:#7a4a38}
.mapb{position:absolute;left:268px;width:200px;top:700px;text-align:center;pointer-events:auto}
.mapb a{display:inline-block;font-size:20px;font-style:italic;color:#fff8ec;text-decoration:none;padding:10px 26px;border-radius:40px;
  background:linear-gradient(180deg,#c29549,#9c6f2c);box-shadow:0 6px 18px rgba(120,70,20,.3),inset 0 1px 0 rgba(255,240,200,.6)}
.mapb a:focus-visible{outline:2px solid #6a3322;outline-offset:3px}
/* navigation */
.cue{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;text-align:center;
  font-style:italic;font-size:16px;color:#fff8ea;text-shadow:0 1px 3px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .7s}
.cue.show{opacity:1;pointer-events:auto;cursor:pointer}
.cue i{display:block;width:14px;height:14px;margin:4px auto 0;border-right:1.5px solid #fff8ea;border-bottom:1.5px solid #fff8ea;transform:rotate(45deg);animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(-3px) rotate(45deg);opacity:.5}50%{transform:translateY(4px) rotate(45deg);opacity:1}}
.dots{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;gap:12px;opacity:0;transition:opacity .7s;pointer-events:none}
.dots.show{opacity:1;pointer-events:auto}
.dots button{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,244,220,.9);background:rgba(40,20,10,.25);cursor:pointer;padding:0;box-shadow:0 0 4px rgba(0,0,0,.4)}
.dots button[aria-current="true"]{background:#f3d98f}
/* ---------- gate fly-through ---------- */
.gateglow{position:absolute;left:374.5px;top:632px;width:90px;height:110px;margin:-55px 0 0 -45px;border-radius:50%;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(closest-side,rgba(255,246,220,.95),rgba(255,226,160,.45) 45%,rgba(255,210,130,0))}
#s3{transform-origin:0 0}
.fr{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.fr .stage img.bgi{left:0;top:0}
#frB{visibility:hidden}
/* ---------- screen-space pages over the arch ---------- */
.ui3{position:absolute;pointer-events:none;color:#4e2a1f}
.pgu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;visibility:hidden}
.pgu.vis{visibility:visible;pointer-events:auto}
.ph1{font-family:"Pinyon Script","Tiro Devanagari Hindi",cursive;font-size:2.5em;line-height:1.15;color:#6a3322;text-align:center}
.ph2{font-style:italic;font-size:.98em;color:#8a5a4a;text-align:center;margin-top:.1em}
.orn{display:block;width:9em;height:.9em;margin:.35em auto .5em}
.scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#c9a667 transparent}

/* ---------- the golden key ---------- */
const KH = { x: 368.5, y: 728 }, KREST = { x: 452, y: 742 }, KLEN = 172;
const keyEl = $("#key"), keyIn = keyEl.querySelector(".kin"), seam = $("#seam"), plate = $("#plate");
const K = { mode: "idle", t0: 0, x: 0, y: 0, fx: 0, fy: 0, ox: 0, oy: 0, vx: 0 };
let cur1S = 1;
const s2scr = p => ({ x: P.x + (L1.x + p.x * L1.f - P.x) * cur1S, y: P.y + (L1.y + p.y * L1.f - P.y) * cur1S });
function unlock() {
  if (state !== "closed" || (K.mode !== "idle" && K.mode !== "drag")) return;
  Sound.init(); if (Sound.ctx && Sound.ctx.state === "suspended") Sound.ctx.resume();
  K.r0 = K.mode === "idle" ? -24 : 0; K.fx = K.x; K.fy = K.y; K.mode = "fly"; K.t0 = now(); keyEl.classList.remove("drag");
  $("#s1").classList.add("unlocking"); $("#hintTxt").textContent = "Unlocking…";

}

  K.mode = "drag"; K.ox = e.clientX - K.x; K.oy = e.clientY - K.y; keyEl.setPointerCapture(e.pointerId); keyEl.classList.add("drag"); });
keyEl.addEventListener("pointermove", e => { if (K.mode !== "drag") return; const nx = e.clientX - K.ox;

  else if (K.mode === "insert") { const e = eout(clamp(T / .4)); K.x = h.x; K.y = h.y - 22 * L1.f * cur1S * e; clip = 22 * 176 / KLEN * e;

/* ---------- render loop ---------- */
const iimg = $("#iimg"), ibg = $("#ibg"), leafL = $("#leafL"), leafR = $("#leafR"), rays = $("#rays"), ilight = $("#ilight"), w1 = $("#w1"), w2 = $("#w2"), tilt = $("#tilt1"), flash = $("#flash");

const PL = partsOf(leafL), PR = partsOf(leafR);
let last = now();
function loop() {
  const t = now(), dt = Math.min(.05, t - last); last = t; const f = dt * 60;
  pt.x = lerp(pt.x, pointer.x, 1 - Math.exp(-dt * 3)); pt.y = lerp(pt.y, pointer.y, 1 - Math.exp(-dt * 3));

    if (tr) { const k = clamp((t - tr.t0) / tr.dur), lo = Math.min(tr.a, tr.b), fwd = tr.b > tr.a;
