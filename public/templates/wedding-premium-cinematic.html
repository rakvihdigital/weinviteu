  /* ==========================================================================
     ENVELOPE — four flaps cut from envelope.jpg along its printed folds
     (coordinates are pixels of the 720 × 1281 photo)
     ========================================================================== */
  const ENV = { w: 720, h: 1281, seal: [360, 596], hole: 139 };
  const FLAPS = [   // paint order: sides, bottom, then the top flap which sits over everything
    { id: 'l', pts: [[0, 0], [70, 0], [310, 470], [362, 596], [265, 730], [40, 1281], [0, 1281]], origin: '0% 50%', axis: 'Y' },
    { id: 'r', pts: [[655, 0], [720, 0], [720, 1190], [440, 720], [362, 596], [420, 460]], origin: '100% 50%', axis: 'Y' },
    { id: 'b', pts: [[440, 720], [720, 1190], [720, 1281], [40, 1281], [265, 730], [362, 596]], origin: '50% 100%', axis: 'X' },
    { id: 't', pts: [[70, 0], [655, 0], [420, 460], [362, 596], [310, 470]], origin: '50% 0%', axis: 'X' }
  ];

  function buildEnvelope() {
    const wrap = $('#envFlaps');
    if (!wrap) return;
    const pc = (v, of) => `${((v / of) * 100).toFixed(3)}%`;
    const hole = `radial-gradient(ellipse ${pc(ENV.hole, ENV.w)} ${pc(ENV.hole, ENV.h)} at ${pc(ENV.seal[0], ENV.w)} ${pc(ENV.seal[1], ENV.h)}, transparent 98%, #000 100%)`;
    // one surface per flap (Safari mishandles hidden back faces); it switches to the lining once turned past 90°
    wrap.innerHTML = FLAPS.map(f => {
      const clip = `polygon(${f.pts.map(([x, y]) => `${pc(x, ENV.w)} ${pc(y, ENV.h)}`).join(', ')})`;
      return `<div class="flap flap--${f.id}" data-axis="${f.axis}" style="transform-origin:${f.origin};-webkit-clip-path:${clip};clip-path:${clip};--hole:${hole}"></div>`;
    }).join('');
  }

  /* ==========================================================================
     SAVE THE DATE — three gold coins, scratch to reveal
     ========================================================================== */
  function makeCoin(coin, onDone) {
    const cv = $('canvas', coin);
    const g = cv.getContext('2d', { willReadFrequently: true });
    let last = null, moves = 0, done = false, touched = false, buzz = 0;

    const paint = () => {
      if (touched || done) return;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const s = Math.round(coin.clientWidth * dpr), r = s / 2;
      cv.width = cv.height = s;
      g.globalCompositeOperation = 'source-over';
      const grad = g.createLinearGradient(0, 0, s, s);
      [[0, '#8d672c'], [0.22, '#e9d39b'], [0.42, '#b48d48'], [0.58, '#f6e6bb'], [0.78, '#a57b37'], [1, '#dcbd7b']].forEach(([o, c]) => grad.addColorStop(o, c));
      g.fillStyle = grad;
      g.fillRect(0, 0, s, s);
      g.lineWidth = 0.6 * dpr;                       // engraved rings, like a minted coin
      for (let k = 6 * dpr, i = 0; k < r; k += 3.5 * dpr, i++) {
        g.strokeStyle = `rgba(255,248,225,${i % 2 ? 0.07 : 0.17})`;
        g.beginPath(); g.arc(r, r, k, 0, Math.PI * 2); g.stroke();
      }
      for (let i = 0; i < (s * s) / 36; i++) {      // foil grain
        g.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,.2)' : 'rgba(90,60,20,.16)';
        g.fillRect(Math.random() * s, Math.random() * s, dpr, dpr);
      }
      g.textAlign = 'center'; g.textBaseline = 'middle';
      const engrave = (txt, font, y) => {
        g.font = font;
        g.fillStyle = 'rgba(255,246,220,.7)'; g.fillText(txt, r, y + dpr);
        g.fillStyle = 'rgba(92,62,20,.62)'; g.fillText(txt, r, y);
      };
      engrave('✦', `${16 * dpr}px Georgia, serif`, r - 8 * dpr);
      if ('letterSpacing' in g) g.letterSpacing = `${2.4 * dpr}px`;
      engrave('SCRATCH', `500 ${8 * dpr}px Jost, sans-serif`, r + 13 * dpr);
      if ('letterSpacing' in g) g.letterSpacing = '0px';
    };

    const point = e => {
      const b = cv.getBoundingClientRect();
      return [((e.clientX - b.left) / b.width) * cv.width, ((e.clientY - b.top) / b.height) * cv.height];
    };
    const check = () => {
      if (done) return;
      const s = cv.width, r = s / 2, data = g.getImageData(0, 0, s, s).data;
      let clear = 0, total = 0;
      for (let y = 0; y < s; y += 4) for (let x = 0; x < s; x += 4) {
        if ((x - r) ** 2 + (y - r) ** 2 > r * r) continue;
        total++;
        if (data[(y * s + x) * 4 + 3] < 100) clear++;
      }
      if (clear / total > 0.36) reveal();
    };
    const scratch = ([x, y]) => {
      g.globalCompositeOperation = 'destination-out';
      g.lineCap = g.lineJoin = 'round';
      g.lineWidth = cv.width * 0.26;
      g.beginPath();
      if (last) { g.moveTo(last[0], last[1]); g.lineTo(x, y); g.stroke(); }
      else { g.arc(x, y, g.lineWidth / 2, 0, Math.PI * 2); g.fill(); }
      last = [x, y];
      if (++moves % 6 === 0) check();
      const now = performance.now();
      if (navigator.vibrate && now - buzz > 90) { buzz = now; navigator.vibrate(4); }
    };
    const reveal = () => {
      if (done) return;
      done = true;
      coin.classList.add('touched', 'done');
      if (window.confetti && !reduce) {
        const b = coin.getBoundingClientRect();
        confetti({ particleCount: 34, spread: 75, startVelocity: 22, gravity: 0.8, ticks: 150, scalar: 0.7, zIndex: 95,
          origin: { x: (b.left + b.width / 2) / innerWidth, y: (b.top + b.height / 2) / innerHeight },
          colors: ['#c5a063', '#e8d5a8', '#f8eccb', '#957038'], disableForReducedMotion: true });
      }
      if (navigator.vibrate) navigator.vibrate(18);
      onDone();
    };

    cv.addEventListener('pointerdown', e => {
      if (done) return;
      e.preventDefault();
      cv.setPointerCapture(e.pointerId);
      touched = true;
      coin.classList.add('touched');
      coin.parentElement.classList.add('started');
      last = null;
      scratch(point(e));
    });
    cv.addEventListener('pointermove', e => { if (!done && cv.hasPointerCapture(e.pointerId)) scratch(point(e)); });
    const end = () => { last = null; check(); };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);

    paint();
    if (document.fonts) document.fonts.ready.then(paint);
    return { paint, reveal };
  }

  function initScratch() {
    const box = $('#scratch');
    if (!box) return;
    const parts = {
      day: dfmt(C.wedding.date, { day: '2-digit' }),
      month: dfmt(C.wedding.date, { month: 'short' }),
      year: dfmt(C.wedding.date, { year: 'numeric' })
    };
    const after = $('#scratchAfter');
    const skip = $('#scratchSkip');
    let revealed = 0, finished = false;

    const finish = () => {
      if (finished) return;
      finished = true;
      skip.hidden = true;
      if (hasGSAP) {
        gsap.fromTo(after, { height: 0, autoAlpha: 0 }, { height: 'auto', autoAlpha: 1, duration: 1.3, ease: 'expo.out', onComplete: () => ScrollTrigger.refresh() });
        gsap.fromTo('.scratch__after > *', { y: 30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, stagger: 0.1, duration: 1.1, ease: 'expo.out', delay: 0.2 });
        gsap.fromTo('.cd__u', { y: 40, scale: 0.9, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, stagger: 0.1, duration: 1.1, ease: 'expo.out', delay: 0.5 });
      } else { after.style.height = 'auto'; after.style.opacity = 1; }
      if (window.confetti && !reduce) {
        const b = box.getBoundingClientRect();
        const y = (b.top + b.height / 2) / innerHeight;
        const base = { particleCount: 70, spread: 70, startVelocity: 42, ticks: 260, zIndex: 95, colors: ['#c5a063', '#e8d5a8', '#f8eccb', '#b9898f', '#ffffff'], disableForReducedMotion: true };
        confetti({ ...base, angle: 60, origin: { x: 0.1, y } });
        confetti({ ...base, angle: 120, origin: { x: 0.9, y } });
      }
    };

    const coins = $$('.scoin', box).map(coin => {
      $('b', coin).textContent = parts[coin.dataset.part];
      return makeCoin(coin, () => { if (++revealed === 3) setTimeout(finish, 450); });
    });
    skip.addEventListener('click', () => coins.forEach((c, i) => setTimeout(c.reveal, i * 220)));
    let rt;
    window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => coins.forEach(c => c.paint()), 200); });
  }


  /* ==========================================================================
     RSVP
     ========================================================================== */
  function initRsvp() {
    const form = $('#rsvpForm');
    const done = $('#rsvpDone');
    const err = $('#formErr');
    const out = $('#guestCount');
    const yesBlock = $('.if-yes');
    const max = seatsParam || C.rsvp.maxGuests || 6;
    let count = Math.min(seatsParam || 1, max);
    out.textContent = count;
    if (guestParam && !$('#fName').value) $('#fName').value = guestParam;

    $$('[data-step]', form).forEach(b => b.addEventListener('click', () => {
      count = Math.max(1, Math.min(max, count + +b.dataset.step));
      out.textContent = count;
      if (hasGSAP) gsap.fromTo(out, { scale: 1.4 }, { scale: 1, duration: 0.5, ease: 'back.out(3)' });
    }));

    const toggleYes = show => {
      if (!hasGSAP) { yesBlock.hidden = !show; return; }
      if (show) {
        yesBlock.hidden = false;
        gsap.fromTo(yesBlock, { height: 0, autoAlpha: 0 }, { height: 'auto', autoAlpha: 1, duration: 0.7, ease: 'expo.out', onComplete: () => ScrollTrigger.refresh() });
      } else {
        gsap.to(yesBlock, { height: 0, autoAlpha: 0, duration: 0.5, ease: 'expo.inOut', onComplete: () => { yesBlock.hidden = true; ScrollTrigger.refresh(); } });
      }
    };
    $$('input[name="attend"]', form).forEach(r => r.addEventListener('change', () => { err.textContent = ''; toggleYes(r.value === 'yes'); }));

    const flyAway = then => {
      const fly = $('.rsvp__fly');
      if (!hasGSAP || reduce || !fly) { then(); return; }
      gsap.timeline({ onComplete: then })
        .to(form, { scale: 0.55, rotateX: 55, y: -30, autoAlpha: 0, transformPerspective: 900, duration: 0.75, ease: 'power3.in' })
        .set(fly, { display: 'block' })
        .fromTo(fly, { scale: 0.4, autoAlpha: 0, y: 30 }, { scale: 1, autoAlpha: 1, y: 0, duration: 0.55, ease: 'back.out(2)' }, '-=0.15')
        .fromTo('.fly__flap', { scaleY: -1, transformOrigin: '50% 0%' }, { scaleY: 1, duration: 0.5, ease: 'power2.inOut' })
        .fromTo('.fly__seal', { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.45, ease: 'back.out(3)' })
        .to(fly, { x: 170, y: -300, rotate: 22, scale: 0.45, autoAlpha: 0, duration: 1, ease: 'power2.in' }, '+=0.25')
        .set(fly, { display: 'none', x: 0, y: 0, rotate: 0 })
        .set(form, { clearProps: 'transform,opacity,visibility' });
    };

    const showDone = (data, celebrate) => {
      const first = data.name.length <= 20 ? data.name : data.name.split(/\s+/)[0];
      $('#doneTitle').textContent = `${ui('thanks')}, ${first}!`;
      $('#doneText').textContent = data.attending === 'yes' ? ui('thanksYes') : ui('thanksNo');
      form.hidden = true;
      done.hidden = false;
      if (hasGSAP) {
        gsap.fromTo(done.children, { y: 30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, stagger: 0.1, duration: 1, ease: 'expo.out' });
        ScrollTrigger.refresh();
      }
      if (celebrate && data.attending === 'yes' && window.confetti && !reduce) {
        const r = $('.rsvp').getBoundingClientRect();
        confetti({ particleCount: 140, spread: 90, startVelocity: 40, origin: { x: 0.5, y: Math.min(0.9, (r.top + 120) / innerHeight) }, colors: ['#c9a55c', '#ebd7a6', '#b23a4a', '#ffffff'], zIndex: 95 });
      }
    };

    $('#rsvpEdit').addEventListener('click', () => {
      done.hidden = true;
      form.hidden = false;
      if (hasGSAP) { gsap.fromTo(form, { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.8 }); ScrollTrigger.refresh(); }
    });

    form.addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(form);
      const name = String(fd.get('name') || '').trim();
      const attending = fd.get('attend');
      if (!name) { err.textContent = ui('needName'); $('#fName').focus(); return; }
      if (!attending) { err.textContent = ui('needAttend'); return; }
      err.textContent = '';
      const yes = attending === 'yes';
      const data = {
        name,
        phone: String(fd.get('phone') || '').trim(),
        attending,
        guests: yes ? count : 0,
        events: yes ? fd.getAll('events').map(i => en(C.events[+i].name)) : [],
        meal: yes ? en(C.ui.meals[+fd.get('meal')]) : '',
        pickup: yes ? fd.get('pickup') : 'no',
        arrival: yes ? String(fd.get('arrival') || '').trim() : '',
        message: String(fd.get('message') || '').trim(),
        invitedAs: guestParam,
        submittedAt: new Date().toISOString()
      };
      const lines = [
        `💌 RSVP — ${namesEn} (${C.wedding.dateShort})`,
        ``,
        `Name: ${data.name}`,
        data.phone && `Phone: ${data.phone}`,
        `Attending: ${yes ? 'Yes, joyfully! 🎉' : 'Regretfully, no'}`,
        yes && `Guests: ${data.guests}`,
        yes && `Events: ${data.events.join(', ') || '—'}`,
        yes && `Meal: ${data.meal}`,
        yes && `Pickup needed: ${data.pickup === 'yes' ? 'Yes' : 'No'}`,
        yes && data.arrival && `Arrival: ${data.arrival}`,
        data.message && `\nMessage: ${data.message}`
      ].filter(Boolean);
      if (C.rsvp.whatsapp) window.open(`https://wa.me/${C.rsvp.whatsapp}?text=${encodeURIComponent(lines.join('\n'))}`, '_blank', 'noopener');
      if (C.rsvp.endpoint) {
        fetch(C.rsvp.endpoint, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) }).catch(() => {});
      }
      store.set('rsvp', JSON.stringify(data));
      flyAway(() => showDone(data, true));
    });

    // returning guest: restore their answer
    try {
      const saved = JSON.parse(store.get('rsvp') || 'null');
      if (saved && saved.name) {
        $('#fName').value = saved.name;
        $('#fPhone').value = saved.phone || '';
        $('#fMsg').value = saved.message || '';
        const r = $(`input[name="attend"][value="${saved.attending}"]`, form);
        if (r) r.checked = true;
        yesBlock.hidden = saved.attending !== 'yes';
        if (saved.guests) { count = Math.min(saved.guests, max); out.textContent = count; }
        showDone(saved, false);
      } else yesBlock.hidden = true;
    } catch (e) { yesBlock.hidden = true; }
  }

  /* ==========================================================================
     LIGHTBOX
     ========================================================================== */
  function initLightbox() {
    const lb = $('#lightbox');
    const img = $('img', lb), cap = $('figcaption', lb);
    let idx = 0;
    const show = i => {
      idx = (i + C.gallery.length) % C.gallery.length;
      const g = C.gallery[idx];
      img.src = g.src; img.alt = tr(g.caption); cap.textContent = tr(g.caption);
      if (hasGSAP) gsap.fromTo('#lightbox figure', { autoAlpha: 0, scale: 0.94 }, { autoAlpha: 1, scale: 1, duration: 0.6, ease: 'expo.out' });
    };
    const open = i => {
      lb.hidden = false;
      if (lenis) lenis.stop();
      if (hasGSAP) gsap.fromTo(lb, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 });
      show(i);
    };
    const close = () => {
      const end = () => { lb.hidden = true; if (lenis) lenis.start(); };
      if (hasGSAP) gsap.to(lb, { autoAlpha: 0, duration: 0.35, onComplete: end }); else end();
    };
    $('#galleryTrack').addEventListener('click', e => {
      const f = e.target.closest('.gfig');
      if (f) open(+f.dataset.i);
    });
    $('.lightbox__close', lb).addEventListener('click', close);
    $('.lightbox__nav--prev', lb).addEventListener('click', () => show(idx - 1));
    $('.lightbox__nav--next', lb).addEventListener('click', () => show(idx + 1));
    lb.addEventListener('click', e => { if (e.target === lb) close(); });
    let sx = 0;
    lb.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - sx;
      if (Math.abs(dx) > 50) show(idx + (dx < 0 ? 1 : -1));
    });
    document.addEventListener('keydown', e => {
      if (lb.hidden) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowRight') show(idx + 1);
      if (e.key === 'ArrowLeft') show(idx - 1);
    });
  }

  /* ==========================================================================
     FILM MODAL — the three parts back-to-back, synced to the soundtrack
     ========================================================================== */
  function initFilmModal() {
    const fm = $('#filmModal');
    const vids = $$('video', fm);
    const endCard = $('.filmmodal__end', fm);
    const bar = $('.filmmodal__bar i', fm);
    const offs = C.media.filmOffsets;
    let part = 0, raf = 0, hadMusic = false;

    const playPart = i => {
      part = i;
      vids.forEach((v, k) => v.classList.toggle('on', k === i));
      const v = vids[i];
      v.currentTime = 0;
      v.play().catch(() => {});
      if (Math.abs(music.currentTime - offs[i]) > 0.3) music.currentTime = offs[i];
    };
    const loop = () => {
      const d = music.duration || 38.4;
      bar.style.transform = `scaleX(${Math.min(1, music.currentTime / d)})`;
      const v = vids[part];
      const expect = music.currentTime - offs[part];
      if (!v.paused && expect > 0 && expect < (v.duration || 99) - 0.3 && Math.abs(v.currentTime - expect) > 0.35) v.currentTime = expect;
      raf = requestAnimationFrame(loop);
    };
    const showEnd = () => {
      if (!hasGSAP) { endCard.style.opacity = 1; return; }
      gsap.to(endCard, { autoAlpha: 1, duration: 1.2 });
      gsap.fromTo(endCard.children, { y: 30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, stagger: 0.15, duration: 1.4, ease: 'expo.out' });
    };
    vids.forEach((v, i) => v.addEventListener('ended', () => {
      if (!filmModalOpen) return;
      if (i < vids.length - 1) playPart(i + 1); else showEnd();
    }));

    const open = () => {
      filmModalOpen = true;
      fm.hidden = false;
      if (lenis) lenis.stop();
      films.forEach(f => f.v.pause());
      vids.forEach((v, i) => { if (!v.getAttribute('src')) { v.preload = 'auto'; v.src = C.media.films[i]; } });
      if (hasGSAP) { gsap.set(endCard, { autoAlpha: 0 }); gsap.fromTo(fm, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }); }
      hadMusic = musicOn;
      music.loop = false;
      music.currentTime = 0;
      music.volume = 0.9;
      music.play().then(() => { musicOn = true; setMusicUI(); }).catch(() => {});
      playPart(0);
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(loop);
    };
    const close = () => {
      filmModalOpen = false;
      cancelAnimationFrame(raf);
      vids.forEach(v => v.pause());
      music.loop = true;
      if (!hadMusic) pauseMusic();
      const end = () => { fm.hidden = true; if (lenis && gateOpened) lenis.start(); };
      if (hasGSAP) gsap.to(fm, { autoAlpha: 0, duration: 0.4, onComplete: end }); else end();
    };
    document.addEventListener('click', e => { if (e.target.closest('[data-film-modal]')) { e.preventDefault(); open(); } });
    $('.filmmodal__close', fm).addEventListener('click', close);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && filmModalOpen) close(); });
  }

  function initDust() {
    if (reduce) return;
    const cv = $('#dust'), c = cv.getContext('2d');
    let w = 0, h = 0, dpr = 1;
    const N = finePointer ? 44 : 24;
    const parts = [];
    const resize = () => {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      w = innerWidth; h = innerHeight;
      cv.width = w * dpr; cv.height = h * dpr;
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    window.addEventListener('resize', resize);
    for (let i = 0; i < N; i++) {
      parts.push({ x: Math.random() * w, y: Math.random() * h, r: 0.5 + Math.random() * 1.7, vy: -(0.08 + Math.random() * 0.3), vx: (Math.random() - 0.5) * 0.18, a: Math.random() * 6.28, s: 0.006 + Math.random() * 0.018 });
    }
    const draw = () => {
      if (!document.hidden) {
        c.clearRect(0, 0, w, h);
        for (const p of parts) {
          p.x += p.vx; p.y += p.vy; p.a += p.s;
          if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
          if (p.x < -10) p.x = w + 10; else if (p.x > w + 10) p.x = -10;
          const al = (Math.sin(p.a) + 1) / 2;
          c.fillStyle = `rgba(235,210,150,${al * 0.18})`;
          c.beginPath(); c.arc(p.x, p.y, p.r * 3.2, 0, 6.283); c.fill();
          c.fillStyle = `rgba(255,240,200,${al * 0.75})`;
          c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.283); c.fill();
        }
      }
      requestAnimationFrame(draw);
    };
    requestAnimationFrame(draw);
  }

      $('#loader').remove();
      initStage();
      films.forEach(f => { f.v.loop = true; f.v.autoplay = true; f.v.play().catch(() => {}); });
      return;
    }

    gsap.registerPlugin(ScrollTrigger);
    ScrollTrigger.config({ ignoreMobileResize: true });
    if (!reduce && window.Lenis) {
      lenis = new Lenis({ lerp: 0.085, wheelMultiplier: 0.95 });
      lenis.on('scroll', ScrollTrigger.update);
      gsap.ticker.add(t => lenis.raf(t * 1000));
      gsap.ticker.lagSmoothing(0);
      lenis.stop();
    }
    gsap.ticker.add(() => films.forEach(f => f.tick()));
    gsap.set('.gate__top, .gate__bottom, .gate__hint', { autoAlpha: 0 });
    gsap.set('.topbar', { autoAlpha: 0 });

    ctx = gsap.context(initMotion);
    initStage();
    initMagnetic();
    initDust();
    if (document.fonts) document.fonts.ready.then(() => ScrollTrigger.refresh());
    window.addEventListener('load', () => ScrollTrigger.refresh());

    const skipGate = params.has('open');
    runLoader().then(() => {
      if (skipGate) {
        $('#loader').remove();
        gateOpened = true;
        document.body.classList.add('is-open');
        $('#gate').remove();
        document.body.classList.remove('is-locked');
        gsap.set('.topbar', { autoAlpha: 1 });
        if (lenis) lenis.start();
        ScrollTrigger.refresh();
      } else showGate();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
