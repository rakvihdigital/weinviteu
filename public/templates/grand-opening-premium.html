<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script>const CFG = { company: "The 18 Label" };
function brandMarkup(value){return String(value).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
</script></head><body>
<title>Grand Opening Invitation</title>
<meta name="theme-color" content="#400d19">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=DM+Sans:wght@400;500&display=swap">
<style>
/* Layout: one 9:16 "film" frame. A painted palace garden stays alive behind an arched parchment panel; the panel holds one page of text at a time over a turning chakra. Pages change as a peacock feather flies across the frame. A red curtain covers everything until tapped. Single committed look, no dark variant. */
:root{
  --ground:#2c0911; --paper:#fbf4e2; --ink:#6a2a2a; --maroon:#7a1b33;
  --gold:#a8842f; --gold-hi:#f3dc9a; --gold-deep:#8c5e21; --cream:#f8e6bb;
  --ck:#7b1fa2;
  --script:"Great Vibes","Snell Roundhand","Apple Chancery",cursive;
  --serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --sans:"DM Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--ground);overflow:hidden}
body{color:var(--ink);font-family:var(--serif)}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold-hi);outline-offset:4px}
.theatre{height:100%;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#813141 0,#431421 45%,#1e080e 100%);padding:18px}
.film{height:min(900px,calc(100svh - 36px));aspect-ratio:9/16;max-width:100%;position:relative;overflow:clip;background:#f6efd9;box-shadow:0 20px 100px #0a000bc0,0 0 0 1px #d9ba7340;isolation:isolate;container-type:size;touch-action:none;user-select:none}
@media(max-width:600px){.theatre{padding:0}.film{height:100svh;width:100vw;aspect-ratio:auto;max-width:calc(100svh*.64)}}

/* living garden */
.world,.cover,.vignette{position:absolute;inset:0}
.world{overflow:hidden}
.palace{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;max-width:none;animation:living-palace 19s ease-in-out infinite alternate;transform-origin:50% 60%}
.sunlight{position:absolute;inset:-40%;background:conic-gradient(from 110deg at 48% 0%,transparent,#fffbd45c 20deg,transparent 39deg,#fffbe731 45deg,transparent 60deg);mix-blend-mode:screen;animation:rays 15s ease-in-out infinite alternate;pointer-events:none}
.flora{position:absolute;bottom:-3%;width:34%;height:34%;z-index:4;transform-origin:20% 100%;pointer-events:none;animation:sway 6s ease-in-out infinite alternate}
.flora img{width:100%;height:100%;object-fit:contain;object-position:bottom;max-width:none}
.flora-l{left:-14%}.flora-r{right:-14%;transform:scaleX(-1);animation-name:sway-r;animation-delay:-3s}
.garlands{position:absolute;inset:0;pointer-events:none;z-index:4}
.pendant{position:absolute;top:6.5%;height:12%;width:7%;transform-origin:50% 0;animation:pendulum 5.4s ease-in-out infinite alternate}
.pendant svg{width:100%;height:100%;overflow:visible}
.pendant:nth-child(2),.pendant:nth-child(4){height:9%;animation-delay:-1s}.pendant:nth-child(3){height:7%;animation-delay:-3s}.pendant:nth-child(5){animation-delay:-4s}
.birds{position:absolute;inset:0;z-index:3;pointer-events:none}
.bird{position:absolute;width:17%;height:12%;left:-30%;top:35%;will-change:transform;animation:flight-a 17s linear infinite}
.bird img{width:100%;height:100%;object-fit:contain;animation:hover-bird .23s ease-in-out infinite alternate}
.bird-b{animation:flight-b 21s linear infinite;animation-delay:3s;width:14%;top:49%}
.bird-b img{animation-name:hover-bird-r}
.petals,.fireflies{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.petal{position:absolute;top:-8%;width:9px;height:15px;background:radial-gradient(at 25% 30%,#ffe0d2,#d4698b 75%);border-radius:80% 0 80% 30%;opacity:0;animation:fall linear infinite;box-shadow:inset 1px 0 3px #fff8}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff6cd;box-shadow:0 0 7px 2px #e7bc58;animation:sparkle 5s ease-in-out infinite}
.film:not(.opened) .world *{animation-play-state:paused!important}

/* text sits directly on the painting's own cream centre: no added panel */
.panel{position:absolute;left:17%;right:17%;top:20.5%;bottom:34%;z-index:5}
.aura{position:absolute;left:50%;top:50%;width:70cqw;height:70cqw;margin:-35cqw 0 0 -35cqw;border-radius:50%;background:radial-gradient(circle,var(--ck) 0,transparent 62%);opacity:.14;animation:aura 5s ease-in-out infinite alternate;transition:background 1s}
.chakra{position:absolute;left:50%;top:50%;width:58cqw;height:58cqw;margin:-29cqw 0 0 -29cqw;opacity:.2;pointer-events:none}
.chakra svg{width:100%;height:100%;overflow:visible;display:block}
.chakra .spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 46s linear infinite}
.chakra .spin.rev{animation-duration:30s;animation-direction:reverse}
.panel.plain .chakra,.panel.plain .aura,.panel.plain .rise{display:none}
.chakra.bloom{animation:bloom 1.6s cubic-bezier(.2,.9,.2,1) both}
.rise{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rise i{position:absolute;bottom:-6%;width:1.6cqh;height:1.6cqh;border-radius:50%;background:var(--c);opacity:0;box-shadow:0 0 1.2cqh var(--c);animation:orb linear infinite}
.scene{position:absolute;inset:0;padding:0;text-shadow:0 0 6px #fff8ea,0 0 14px #fff8ea;display:flex;align-items:center;justify-content:center;text-align:center}
.fit{display:flex;flex-direction:column;align-items:center;width:100%;transform-origin:50% 50%}
.fit>*{flex-shrink:0;animation:word-in 1s both;animation-delay:calc(var(--n,0)*.13s + .15s)}

.seven{display:flex;gap:1.3cqh;align-items:center;margin:.6cqh 0 1cqh}
.seven i{width:1.25cqh;height:1.25cqh;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px #fff8,0 0 0 1.5px #b8975080;animation:dot 2.8s ease-in-out infinite;animation-delay:calc(var(--k)*.3s)}
.kicker{font-family:var(--sans);font-size:1.15cqh;letter-spacing:.24em;line-height:1.6;text-transform:uppercase;color:var(--gold);margin:.5cqh 0}
.blessing{font-size:2cqh;font-style:italic;line-height:1.25;color:#7b6a35;margin:.4cqh 0}
.scene h1,.scene h2{font-family:var(--script);font-weight:400;line-height:1.18;margin:.2cqh 0 .5cqh;text-wrap:balance;padding:0 .2em;overflow:visible;color:var(--maroon);animation:word-in 1s both,glint 4s ease-in-out infinite alternate;animation-delay:calc(var(--n,0)*.13s + .15s),0s}
@keyframes glint{from{text-shadow:0 0 6px #fff8ea,0 0 0 #e7b95200}to{text-shadow:0 0 6px #fff8ea,0 0 16px #e7b952aa}}
.fit>*{max-width:100%;overflow-wrap:anywhere}
.scene h1{font-size:6.2cqh}.scene h2{font-size:5.6cqh}
.shop{font-size:2.9cqh;font-weight:600;letter-spacing:.14em;line-height:1.15;margin:.8cqh 0;color:var(--maroon)}
.copy{font-size:2.15cqh;line-height:1.32;margin:.8cqh 0;max-width:27ch}
.note{font-size:1.75cqh;font-style:italic;color:#7b6a35;line-height:1.3;margin:.2cqh 0}
.logow{max-width:none!important;margin:.6cqh 0 .2cqh}
.logo{display:block;width:68cqw;height:auto;filter:brightness(1.08) saturate(1.15) drop-shadow(0 0 1px #fff) drop-shadow(0 2px 8px #c8962f66);animation:logoglow 3.2s ease-in-out infinite alternate}
@keyframes logoglow{from{filter:brightness(1.05) saturate(1.15) drop-shadow(0 0 1px #fff) drop-shadow(0 2px 6px #c8962f55)}to{filter:brightness(1.18) saturate(1.25) drop-shadow(0 0 1px #fff) drop-shadow(0 0 18px #f3d27acc)}}
.detail{margin:.55cqh 0}
.detail span{display:block;font:500 1.02cqh var(--sans);letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin-bottom:.25cqh}
.detail strong{font-size:2.35cqh;font-weight:600;line-height:1.15;display:block;user-select:text}
.detail small{font-size:1.75cqh;display:block;line-height:1.25;font-weight:500}
.qr{padding:.8cqh;background:#fffaf0;border:1px solid #c9a55a;line-height:0;margin:.8cqh 0 .5cqh}
.qr img,.qr canvas{width:11cqh;height:11cqh;display:block}
.btn{font:500 1.25cqh var(--sans);letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:var(--cream);background:linear-gradient(#8f2140,#5c0f26);padding:1.3cqh 2.6cqh;border-radius:99px;border:1px solid #e3c577;margin:.9cqh 0;pointer-events:auto}

/* peacock feather transition: a large feather flies tip-first across the frame; the old page blurs away under it and the new one rises in its wake */
.plume{position:absolute;inset:0;z-index:9;pointer-events:none;visibility:hidden;overflow:hidden}
.plume.run{visibility:visible}
.plume .wash{position:absolute;inset:-20%;background:radial-gradient(circle at 50% 50%,#fffaeaee 0,#f6e2a8aa 28%,#7fc8b433 48%,transparent 66%);opacity:0}
.plume.run .wash{animation:wash 1.5s ease-in-out both}
.plume .feather{position:absolute;left:50%;top:50%;width:46cqh;height:129cqh;margin:-64.5cqh 0 0 -23cqh;will-change:transform;opacity:0}
.plume .feather img{display:block;width:100%;height:100%;max-width:none;will-change:transform;transform-origin:50% 92%;filter:drop-shadow(0 0 1.4cqh #fff2c6aa) drop-shadow(0 1.5cqh 2.5cqh #2c091155);animation:flutter .38s ease-in-out infinite alternate}
.plume.run .feather{animation:fly 1.5s cubic-bezier(.42,.08,.58,.92) both}
.plume.run.back .feather{animation-name:fly-back}
.plume .trail i{position:absolute;width:.7cqh;height:.7cqh;margin:-.35cqh;border-radius:50%;background:var(--c);box-shadow:0 0 1.2cqh .35cqh var(--c);opacity:0}
.plume.run .trail i{animation:glitter .9s ease-out both;animation-delay:var(--a)}
.plume.run.back .trail i{animation-delay:var(--b)}
.plume:not(.run) *{animation-play-state:paused}
.panel.leaving .scene{opacity:0;filter:blur(8px);transform:scale(.97);transition:opacity .55s,filter .55s,transform .55s}

.vignette{z-index:10;pointer-events:none;box-shadow:inset 0 0 45px #a1762225}

/* showroom walk page: scrolling plays the shop video frame by frame, with its own lines of text over it */
.walk{position:absolute;inset:0;z-index:6;background:#2c0911;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .6s,visibility 0s .6s}
.walking .walk{opacity:1;visibility:visible;transition:opacity .6s}
.walking .panel{visibility:hidden}
.walk canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.w-scrim{position:absolute;left:0;right:0;opacity:0}
.w-scrim.top{top:0;height:46%;background:linear-gradient(#2c0911f2 0,#2c0911c4 38%,#2c091166 70%,transparent)}
.w-scrim.bottom{bottom:0;height:60%;background:linear-gradient(transparent,#2c091166 30%,#2c0911c9 58%,#2c0911f5)}
.w-ch{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 9cqw;visibility:hidden}
.w-ch.top{top:7.5cqh}.w-ch.bottom{bottom:17cqh}
.w-ch>*{margin:0;will-change:opacity,transform,filter}
.w-kicker{font:500 1.2cqh var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--gold-hi);text-shadow:0 1px 6px #1a0208}
.w-rule{display:block;width:22cqh;height:2.2cqh;margin:.8cqh 0 .2cqh!important;color:#c9a24e}
.w-rule svg{width:100%;height:100%;display:block;overflow:visible}
.w-title{font-family:var(--script);font-weight:400;font-size:min(5.6cqh,11.5cqw);line-height:1.12;padding:.1em .25em .15em;text-wrap:balance;
  background:linear-gradient(100deg,#d4a547 0%,#fff3c8 30%,#e6bb5c 50%,#fff0bd 70%,#c99636 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .25cqh .5cqh #1a0208cc) drop-shadow(0 0 1.6cqh #e7b95255);animation:w-shine 6s ease-in-out infinite alternate}
.w-copy{font-size:2.15cqh;line-height:1.38;font-style:italic;color:#fbf1dcd0;max-width:30ch;margin-top:.6cqh!important;text-shadow:0 1px 8px #1a0208}
.w-words{font:500 1.15cqh var(--sans);letter-spacing:.3em;text-transform:uppercase;color:#f6e3b4;margin-top:1.2cqh!important}
.timeline button.on.part::before{transform:scaleX(var(--w,0));transition:none}
@keyframes w-shine{from{background-position:0% 0}to{background-position:100% 0}}

/* curtain cover: velvet drapes drawn in CSS so they stay crisp at any size. They breathe and ripple, a sheen passes over them,
   and gold dust drifts in a pool of stage light around a gold-rimmed wax seal. Tapping the seal flashes it open in a burst of
   gold and petals; the drapes gather to the sides, the valance lifts away and the garden settles into view. */
.cover{z-index:20;pointer-events:none;overflow:hidden}
.drape{position:absolute;top:0;bottom:0;width:50.6%;will-change:transform;
  background:
    linear-gradient(#1a0206aa,transparent 24%,transparent 68%,#1a0206d9),
    repeating-linear-gradient(90deg,#0000 0,#ff7a7a12 1.7cqh,#0000 3.4cqh,#1a020640 5.6cqh,#0000 7.6cqh),
    repeating-linear-gradient(90deg,#310c19 0,#59162e 1.8cqh,#792c45 3cqh,#99506a 3.5cqh,#681e36 4.4cqh,#410e21 5.8cqh,#310c19 6.4cqh);
  transition:transform 1.5s cubic-bezier(.6,0,.3,1)}
.drape-l{left:0;transform-origin:0 0;animation:drape-l 6s ease-in-out infinite alternate}
.drape-r{right:0;transform-origin:100% 0;animation:drape-r 6s ease-in-out infinite alternate;animation-delay:-3s}
.drape::after{content:"";position:absolute;top:0;bottom:0;width:1.6cqh;background:linear-gradient(90deg,#1a020600,#1a0206aa)}
.drape-r::after{transform:scaleX(-1)}
.opened .drape::after{background:linear-gradient(90deg,#6e4710,#f6dc8c 45%,#b98a2e);width:1cqh;transition:background 0s .5s}
.drape-l::after{right:0}.drape-r::after{left:0}
.sheen{position:absolute;inset:0;background:linear-gradient(100deg,transparent 38%,#ffd7b01c 46%,#fff2e03d 50%,#ffd7b01c 54%,transparent 62%) 0 0/300% 100% no-repeat;mix-blend-mode:screen;animation:sheen 9s ease-in-out infinite;transition:opacity .6s}
.stage-light{position:absolute;inset:0;background:radial-gradient(ellipse 72% 36% at 50% 46%,#ffc77a3d,transparent 70%),radial-gradient(ellipse 70% 14% at 50% 100%,#ffb06633,transparent 70%),linear-gradient(transparent 70%,#1a020699);mix-blend-mode:screen;animation:spot 4.5s ease-in-out infinite alternate;transition:opacity 1.2s}
.valance{position:absolute;left:-3%;right:-3%;top:0;height:15cqh;transform-origin:50% 0;animation:valance 5s ease-in-out infinite alternate;transition:transform .9s cubic-bezier(.5,0,.3,1)}
.valance svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 1cqh 1.2cqh #1a0206bb)}
.dust{position:absolute;inset:0;transition:opacity .8s}
.dust i{position:absolute;bottom:-2%;width:.45cqh;height:.45cqh;border-radius:50%;background:#ffe9b0;box-shadow:0 0 .9cqh .2cqh #f3c55a;opacity:0;animation:dust linear infinite}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,#fff8e0 0,#f6d88aaa 16%,#f6d88a33 36%,transparent 58%);opacity:0;pointer-events:none}
.cover-copy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--cream);padding:20px}
.cover-copy .eyebrow{font:500 1.15cqh var(--sans);letter-spacing:.3em;margin:0 0 3cqh;color:var(--gold-hi);text-shadow:0 1px 6px #1a0206}
#open{position:relative;border:0;background:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:1.6cqh;pointer-events:auto;padding:0}
.seal{position:relative;display:grid;place-items:center;width:19cqh;height:19cqh;animation:seal-in 1.1s cubic-bezier(.3,1.5,.5,1) .3s both}
.seal-in{display:grid;place-items:center;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
#open:hover .seal-in{transform:scale(1.06)}
.seal .ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible;animation:spin 36s linear infinite}
.seal .ring text{font:600 10px var(--sans);letter-spacing:.18em;fill:#f3dc9a}
.seal .ripple{position:absolute;inset:19.5%;border-radius:50%;border:1px solid #f3dc9acc;animation:ripple 2.8s ease-out infinite;pointer-events:none}
.seal .ripple+.ripple{animation-delay:1.4s}
.wax{position:relative;display:grid;place-items:center;width:11.5cqh;height:11.5cqh;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#d6505f 0,#a11f33 36%,#6c0d1d 74%,#4a0613 100%);animation:wax-glow 3s ease-in-out infinite}
.wax svg{width:64%;height:64%;filter:drop-shadow(0 .15cqh .15cqh #2c0410)}
.open-label{font-family:var(--script);font-size:5.4cqh;line-height:1.15;padding:0 .25em;
  background:linear-gradient(100deg,#d4a547,#fff3c8 35%,#e6bb5c 55%,#fff0bd 75%,#c99636);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .2cqh .4cqh #1a0206);animation:w-shine 5s ease-in-out infinite alternate}
.open-sub{font:500 1.15cqh var(--sans);letter-spacing:.26em;text-transform:uppercase;color:#fbe9c4;text-shadow:0 1px 6px #1a0206;margin-top:-.6cqh}
.cover-foot{position:absolute;bottom:8%;font:500 .95cqh var(--sans);letter-spacing:.22em;line-height:1.7;padding:0 20px;margin:0;color:#f6e3b4;text-shadow:0 1px 6px #1a0206}
.cover-copy .eyebrow,.open-label,.open-sub,.cover-foot{transition:opacity .8s 1.2s,transform .8s 1.2s}
.burst{position:absolute;left:50%;top:9.5cqh;width:0;height:0;pointer-events:none}
.burst i{position:absolute;left:0;top:0;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:50%;background:var(--c);box-shadow:0 0 .8cqh var(--c);opacity:0}
.burst i.pt{height:calc(var(--s)*1.6);border-radius:80% 0 80% 30%;box-shadow:none}
.opened .drape{animation-play-state:paused}
.opened .drape-l{transform:translateX(-17%) scaleX(.16) skewY(-2deg);transition:transform 2.8s cubic-bezier(.55,0,.25,1) .4s}
.opened .drape-r{transform:translateX(17%) scaleX(.16) skewY(2deg);transition:transform 2.8s cubic-bezier(.55,0,.25,1) .4s}
.opened .valance{transform:translateY(-135%);transition:transform 1.3s cubic-bezier(.6,0,.3,1) 2.2s}
.opened .sheen,.opened .stage-light,.opened .dust{opacity:0}
.opened .flash{animation:flash 1.4s ease-out .2s both}
.opened .seal{animation:seal-open .9s cubic-bezier(.3,0,.2,1) both}
.opened .burst i{animation:burst 1.5s cubic-bezier(.15,.7,.3,1) .28s both}
.opened .cover-copy .eyebrow,.opened .open-label,.opened .open-sub,.opened .cover-foot{opacity:0;transform:translateY(1.2cqh);transition:opacity .45s,transform .45s}
.opened .cover-copy{visibility:hidden;transition:visibility 0s 2s}
.opened .cover-copy button{pointer-events:none}
.opened .world{animation:reveal 3.8s cubic-bezier(.25,.6,.2,1) .5s both}

/* controls */
.controls{position:absolute;bottom:0;left:0;right:0;z-index:12;background:linear-gradient(transparent,#2c0911a6 45%,#2c0911e0);padding:20px 14px max(8px,env(safe-area-inset-bottom,0px));opacity:0;transition:opacity 1s;pointer-events:none}
.opened .controls{opacity:1;transition-delay:2.6s}
.controls button{pointer-events:auto}
.hint{display:flex;flex-direction:column;align-items:center;gap:.5cqh;margin:0 auto 1.2cqh;border:0;background:none;padding:0;color:#fff6db}
.hint b{font:600 1.35cqh var(--sans);letter-spacing:.22em;padding:.75cqh 1.9cqh;border-radius:99px;background:#3b0f1ad9;border:1px solid #e3c57799;box-shadow:0 .4cqh 1.6cqh #1a020866;text-shadow:0 1px 3px #000a;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.hint i{display:grid;place-items:center;width:3.6cqh;height:3.6cqh;border-radius:50%;background:#3b0f1ad9;border:1px solid #e3c57799;box-shadow:0 .4cqh 1.4cqh #1a020866;animation:cue 1.6s ease-in-out infinite}
.hint svg{width:2.3cqh;height:2.3cqh;color:var(--gold-hi)}
.hint.up svg{transform:rotate(180deg)}
.timeline{display:flex;gap:5px;margin-bottom:4px}
.timeline button{border:0;background:#fff8;height:3px;flex:1;padding:0;position:relative;overflow:hidden}
.timeline button::before{content:"";position:absolute;inset:0;background:#fff5b5;transform:scaleX(0);transform-origin:left;transition:transform .6s}
.timeline button.on::before{transform:scaleX(1)}
