<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby Shower · Soumya &amp; Rohan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#e07a8f;--rose:#d4637d;--blush:#f7d3da;--cream:#fdf7ef;--brown:#6b4f45;--soft:#a88a80;--gold:#d9b25e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;touch-action:manipulation}
body{font-family:"Quicksand",system-ui,sans-serif;color:var(--brown);-webkit-tap-highlight-color:transparent;
  background:radial-gradient(120% 80% at 50% 0%,#fde9ec,#f8d6dd 60%,#f2c7d0);}
body::before{content:"";position:fixed;inset:0;opacity:.5;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.7) 1.6px,transparent 2px) 0 0/26px 26px,radial-gradient(circle,rgba(230,150,170,.25) 1.2px,transparent 1.6px) 13px 13px/26px 26px}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* ---------- the pink nursery door ---------- */
#door{position:fixed;inset:0;z-index:30;perspective:1800px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,0) 72%,rgba(220,170,150,.25) 72.2%,rgba(0,0,0,0) 72.6%),
  repeating-linear-gradient(90deg,#fbe4e8 0 26px,#f8dbe1 26px 52px)}
#door::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.65) 1.5px,transparent 2px) 13px 10px/52px 40px;opacity:.7;pointer-events:none}
#door .floor{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(180deg,#f3d9cd,#ecc9ba);box-shadow:inset 0 10px 18px rgba(170,110,100,.18)}
#door .floor::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:#fff6f0;box-shadow:0 2px 6px rgba(170,110,100,.2)}
#door .rug{position:absolute;left:50%;bottom:3%;width:min(92vw,620px);height:12%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,#fde9ee 0 55%,#f7c9d4 56% 64%,#fde9ee 65% 80%,#f2b7c5 81% 100%);box-shadow:0 6px 14px rgba(180,110,120,.18)}
.stage{position:absolute;left:50%;bottom:8%;width:min(78vw,430px);height:min(70vh,700px);transform:translateX(-50%)}
.molding{position:absolute;inset:-22px -22px 0;border-radius:50% 50% 0 0/24% 24% 0 0;background:linear-gradient(90deg,#fffaf6,#fff 40%,#f7ece6);
  box-shadow:0 0 0 2px #f1dcd4,inset 0 0 0 7px #fffdfb,inset 0 0 0 9px #e8c27a,0 26px 50px rgba(170,90,110,.25)}
.leaves{position:absolute;inset:0;border-radius:50% 50% 0 0/22% 22% 0 0;overflow:hidden;background:radial-gradient(60% 50% at 50% 55%,#fffaf0,#ffe9c9 60%,#f7cfa8)}
.leaf{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;transition:transform 2.2s cubic-bezier(.6,.05,.25,1);will-change:transform}
.leaf.l{left:0;transform-origin:0 50%}.leaf.r{right:0;transform-origin:100% 50%}
#door.open .leaf.l{transform:rotateY(-110deg)}#door.open .leaf.r{transform:rotateY(110deg)}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;background:linear-gradient(180deg,#f8bfcc 0%,#f2a9ba 55%,#eb9aae 100%)}
.leaf .face::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.18),rgba(255,255,255,0) 30%,rgba(140,40,70,0) 70%,rgba(140,40,70,.12))}
.leaf.l .face{box-shadow:inset -2px 0 0 rgba(170,70,95,.35)}.leaf.r .face{box-shadow:inset 2px 0 0 rgba(255,255,255,.45)}
.panel{position:absolute;left:15%;right:15%;border-radius:12px;background:linear-gradient(180deg,#f9c9d4,#f2b0c0);
  box-shadow:inset 3px 3px 7px rgba(150,50,80,.22),inset -3px -3px 7px rgba(255,255,255,.6),0 0 0 3px rgba(255,255,255,.25)}
.panel::after{content:"";position:absolute;inset:9px;border-radius:7px;border:1.5px solid rgba(232,194,122,.7)}
.panel.p1{top:33%;height:27%}.panel.p2{top:66%;height:25%}
.leaf.l .panel.p0{top:8%;height:18%;left:28%;right:-2px;border-radius:100% 0 0 0/100% 0 0 0}.leaf.r .panel.p0{top:8%;height:18%;right:28%;left:-2px;border-radius:0 100% 0 0/0 100% 0 0}
.leaf .panel.p0::after{display:none}
.knob{position:absolute;top:61%;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6d0,#e6bd63 55%,#a87a2a);box-shadow:0 3px 5px rgba(120,60,20,.35)}
.knob::after{content:"";position:absolute;left:50%;top:100%;width:6px;height:16px;margin-left:-3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,#c9963f,#f1d38a,#c9963f)}
.leaf.l .knob{right:8%}.leaf.r .knob{left:8%}
.garland{position:absolute;inset:-36px -40px auto;height:62%;pointer-events:none;z-index:4}
.garland svg{width:100%;height:100%;overflow:visible}
.garland .bud{transform-box:fill-box;transform-origin:center;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.garland .bulb{animation:bulb 2.4s ease-in-out infinite}
@keyframes bulb{0%,100%{opacity:.35}50%{opacity:1}}
.sign{position:absolute;left:50%;top:7.5%;transform:translateX(-50%);z-index:3;width:48%;transform-origin:50% -40px;animation:signsw 4.6s ease-in-out infinite;pointer-events:none}
@keyframes signsw{0%,100%{transform:translateX(-50%) rotate(-2.5deg)}50%{transform:translateX(-50%) rotate(2.5deg)}}
.sign svg{width:100%;overflow:visible}
.prop{position:absolute;z-index:5;pointer-events:none}
.prop img{width:100%;display:block}
#pTeddy{left:-30%;bottom:-4%;width:44%;transform-origin:50% 100%;animation:teddy 1.8s ease-in-out infinite}
#pShoes{right:-26%;bottom:-2%;width:30%}
#pBalloons{right:-38%;top:6%;width:42%;transform-origin:20% 100%;animation:sway 4.4s ease-in-out infinite}
#pCloud{left:-46%;top:-4%;width:44%;animation:cloudbob 5s ease-in-out infinite}
#pBlocks{position:absolute;left:4%;right:4%;bottom:-6%;display:flex;justify-content:center;gap:2%;z-index:5;pointer-events:none}
#pBlocks img{width:15%;animation:hop 2.4s ease-in-out infinite}
#door .glow{position:absolute;left:50%;top:50%;width:10px;height:100%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,#fffaf0,rgba(255,240,220,.6) 40%,rgba(255,240,220,0));opacity:0;transition:width 1.4s cubic-bezier(.3,.8,.3,1),opacity .8s}
#door.open .glow{width:140%;opacity:1}
/* the balloon: only the balloon itself can be tapped */
#balloon{position:absolute;left:50%;top:57%;z-index:8;width:clamp(116px,19vh,168px);transform:translate(-50%,-50%);border:0;background:none;padding:0;pointer-events:none;animation:bob 3.2s ease-in-out infinite}
#balloon svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 18px 18px rgba(180,80,100,.3))}
#balloon .hit{pointer-events:visiblePainted;cursor:pointer}
#balloon .shine{animation:shine 3s ease-in-out infinite}
@keyframes shine{0%,100%{opacity:.45}50%{opacity:.8}}
@keyframes bob{0%,100%{transform:translate(-50%,-50%) rotate(-3deg)}50%{transform:translate(-50%,-56%) rotate(3deg)}}
#balloon.hover svg{transform:scale(1.06);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
#balloon.nudge{animation:nudge .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes nudge{0%{transform:translate(-50%,-50%) scale(1)}30%{transform:translate(-50%,-50%) scale(1.12) rotate(-6deg)}60%{transform:translate(-50%,-50%) scale(.96) rotate(5deg)}100%{transform:translate(-50%,-50%) scale(1)}}
#balloon.fly{animation:none;transition:transform 1.6s cubic-bezier(.5,0,.75,.3),opacity 1.3s .3s;transform:translate(-50%,-160vh) rotate(12deg) scale(.8);opacity:0}
#balloon:focus-visible{outline:3px solid #fff;outline-offset:8px;border-radius:50%}
.dhint{position:absolute;left:0;right:0;top:calc(57% + clamp(116px,19vh,168px) * .9);text-align:center;z-index:8;pointer-events:none;transition:opacity .5s}
.dhint span{display:inline-block;padding:.5em 1.3em;border-radius:40px;background:rgba(255,255,255,.92);color:var(--rose);font-weight:700;font-size:clamp(13px,1.8vh,16px);letter-spacing:.06em;box-shadow:0 8px 20px rgba(200,100,120,.22)}
.dtitle{position:absolute;left:0;right:0;top:calc(2.2vh + env(safe-area-inset-top,0px));text-align:center;z-index:6;pointer-events:none;transition:opacity .5s}
.dtitle .a{font-family:"Dancing Script",cursive;font-weight:700;font-size:clamp(32px,5vh,50px);color:var(--rose);text-shadow:0 2px 0 #fff}
.dtitle .b{font-weight:700;font-size:clamp(10px,1.4vh,13px);letter-spacing:.32em;color:var(--brown);margin-top:.15em}
#door.open .dhint,#door.open .dtitle{opacity:0}
#door.open .prop,#door.open #pBlocks,#door.open .garland,#door.open .sign{transition:opacity 1s .4s;opacity:0}
.cloudlet{position:absolute;width:120px;height:46px;background:#fff;border-radius:40px;opacity:.8;filter:drop-shadow(0 6px 10px rgba(200,120,140,.15));animation:drift 30s linear infinite}
.cloudlet::before,.cloudlet::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloudlet::before{width:56px;height:56px;left:16px;top:-26px}.cloudlet::after{width:40px;height:40px;left:58px;top:-16px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(calc(100vw + 160px))}}
@media (orientation:portrait){.stage{width:min(70vw,400px);height:min(62vh,640px);bottom:12%}#pCloud{display:none}#pBalloons{right:-12%;width:32%;top:2%}#pTeddy{left:-12%;width:36%}#pShoes{right:-8%;width:24%}}

/* ---------- the invitation card ---------- */
#card{position:fixed;z-index:5;opacity:0;transform:scale(.92);transition:opacity 1s ease,transform 1.2s cubic-bezier(.3,1.4,.5,1)}
#card.show{opacity:1;transform:none}
#frame{position:absolute;inset:0;width:100%;height:100%}
.deco{position:absolute;pointer-events:auto;user-select:none;-webkit-user-drag:none}
.deco img{width:100%;display:block;pointer-events:none}
#dCloud{left:-2%;top:.5%;width:31%;animation:cloudbob 5s ease-in-out infinite}
@keyframes cloudbob{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-6px)}}
#dBalloons{right:-4%;top:-1%;width:29%;transform-origin:50% 100%;animation:sway 4.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-10px)}}
#dTeddy{left:-3%;bottom:1.5%;width:31%;transform-origin:50% 100%;animation:teddy 1.6s ease-in-out infinite}
@keyframes teddy{0%,100%{transform:translateY(0) scale(1,1) rotate(0)}18%{transform:translateY(0) scale(1.05,.94)}45%{transform:translateY(-12%) scale(.97,1.04) rotate(-3deg)}70%{transform:translateY(0) scale(1.04,.95) rotate(2deg)}85%{transform:scale(1,1)}}
#dTeddy.jump{animation:teddyjump .9s cubic-bezier(.3,1.5,.5,1)}
@keyframes teddyjump{0%{transform:none}40%{transform:translateY(-30%) rotate(-10deg)}100%{transform:none}}
.blk{position:absolute;bottom:1%;width:10.5%;animation:hop 2.4s ease-in-out infinite}
@keyframes hop{0%,60%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-38%) rotate(-8deg)}35%{transform:translateY(0) rotate(3deg)}}
#dShoes{right:1%;bottom:1.2%;width:22%}
#dShoes img{animation:tap 1.4s ease-in-out infinite;transform-origin:30% 90%}
@keyframes tap{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
#dFlowers{right:22%;bottom:.5%;width:12%;transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite}
#dStar{left:4%;top:42%;width:5%;animation:twinkle 2.2s ease-in-out infinite}
#dHeart{right:4.5%;top:44%;width:5.5%;animation:beat 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.8) rotate(0);opacity:.7}50%{transform:scale(1.15) rotate(20deg);opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}

/* ---------- content in the middle of the card ---------- */
#content{position:absolute;left:9%;right:9%;top:15%;bottom:19%}
.pg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;visibility:hidden;opacity:0;transition:opacity .5s}
.pg.vis{visibility:visible;opacity:1}
.pg.leave{visibility:visible;opacity:0;transform:translateY(-14%) scale(.96);transition:opacity .7s ease,transform .9s cubic-bezier(.5,0,.75,0)}
.pg .in{width:100%;max-height:100%;overflow:auto;scrollbar-width:none;padding:4px 2px}
.pg .in::-webkit-scrollbar{display:none}
.pop{opacity:0;transform:translateY(18px) scale(.86)}
.pg.on .pop{animation:popin .9s cubic-bezier(.3,1.6,.5,1) var(--d,0s) both}
@keyframes popin{0%{opacity:0;transform:translateY(18px) scale(.86)}100%{opacity:1;transform:none}}
.cap{font-weight:700;font-size:var(--f1);letter-spacing:.28em;color:var(--brown)}
.script{font-family:"Dancing Script",cursive;font-weight:700;color:var(--pink);line-height:1.02;text-shadow:0 2px 0 #fff}
.s1{font-size:var(--f5)}.s2{font-size:var(--f4)}.s3{font-size:var(--f3)}
.txt{font-size:var(--f2);line-height:1.5;color:var(--brown);font-weight:500}
.soft{color:var(--soft)}
.ribbon{display:inline-block;padding:.35em 1.6em;background:var(--pink);color:#fff;font-weight:700;letter-spacing:.24em;font-size:var(--f1);clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%);margin:.5em 0}
.dots-sep{display:flex;align-items:center;gap:.5em;justify-content:center;margin:.55em 0;color:var(--pink)}
.dots-sep i{display:block;width:4.5em;border-top:2px dotted rgba(224,122,143,.6)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;width:100%;margin-top:.4em}
.facts div{padding:.2em .3em;border-right:2px dotted rgba(224,122,143,.45);display:flex;flex-direction:column;align-items:center;gap:.25em}
.facts div:last-child{border:0}
.facts svg{width:1.7em;height:1.7em;color:var(--pink)}
.facts b{font-weight:700;font-size:var(--f2);color:var(--brown);line-height:1.25}
.cd{display:flex;gap:.6em;justify-content:center;margin:.6em 0}
.cd div{width:4.2em;padding:.5em 0;border-radius:16px;background:#fff;box-shadow:0 6px 14px rgba(224,122,143,.2),inset 0 0 0 2px #f9dbe1}
.cd b{display:block;font-family:"Fredoka";font-weight:600;font-size:var(--f4);color:var(--rose);line-height:1}
.cd small{font-weight:700;font-size:calc(var(--f1) * .9);letter-spacing:.18em;color:var(--soft)}
.disc{margin-top:.8em;font-weight:700;font-size:var(--f1);letter-spacing:.3em;color:var(--pink);animation:nudgeY 1.8s ease-in-out infinite}
@keyframes nudgeY{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.vote{display:flex;gap:.7em;justify-content:center;margin-top:.8em;flex-wrap:wrap}
.vbtn{font:inherit;font-family:"Fredoka";font-weight:600;font-size:var(--f2);padding:.75em 1.3em;border-radius:40px;border:0;cursor:pointer;min-height:44px;color:#fff;transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .3s}
.vbtn.boy{background:linear-gradient(180deg,#9fd0f0,#6fb3e0);box-shadow:0 8px 18px rgba(80,150,210,.35)}.vbtn.girl{background:linear-gradient(180deg,#f7a8bb,#e07a8f);box-shadow:0 8px 18px rgba(224,122,143,.4)}
.vbtn:hover{transform:translateY(-3px) scale(1.04)}.vbtn[aria-pressed="true"]{outline:3px solid #fff;outline-offset:3px}
.bars{width:100%;max-width:20em;margin:1em auto 0;display:flex;flex-direction:column;gap:.5em}
.bar{display:grid;grid-template-columns:5.5em 1fr 3em;align-items:center;gap:.5em;font-weight:700;font-size:var(--f1);color:var(--brown)}
.bar .tr{height:14px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 2px #f6dce2;overflow:hidden}
.bar .fl{height:100%;width:0;border-radius:10px;transition:width 1.2s cubic-bezier(.3,1.2,.5,1)}
.bar.b .fl{background:linear-gradient(90deg,#b8ddf5,#6fb3e0)}.bar.g .fl{background:linear-gradient(90deg,#fbc4d0,#e07a8f)}
.sched{width:100%;display:flex;flex-direction:column;gap:.7em;margin-top:.6em;text-align:left}
.ev{display:grid;grid-template-columns:2.6em 1fr;gap:.7em;align-items:start;padding:.65em .8em;border-radius:16px;background:rgba(255,255,255,.75);box-shadow:0 4px 12px rgba(224,122,143,.14)}
.ev .em{width:2.6em;height:2.6em;border-radius:50%;display:grid;place-items:center;font-size:1.3em;background:#fde4ea}
.ev .tm{font-family:"Fredoka";font-weight:600;font-size:calc(var(--f1) * 1.05);color:var(--rose);letter-spacing:.04em}
.ev h4{font-weight:700;font-size:var(--f2);color:var(--brown);margin:.1em 0}
.ev p{font-size:calc(var(--f1) * 1.08);line-height:1.45;color:var(--soft);font-weight:500}
.btn{font:inherit;font-family:"Fredoka";font-weight:600;display:inline-flex;align-items:center;gap:.4em;margin-top:.7em;padding:.7em 1.5em;border-radius:40px;border:0;cursor:pointer;text-decoration:none;font-size:var(--f2);
  color:#fff;background:linear-gradient(180deg,#f29aae,#e07a8f);box-shadow:0 8px 18px rgba(224,122,143,.38);min-height:44px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn:focus-visible,.vbtn:focus-visible,.form input:focus-visible,.like:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:.35em;justify-content:center;margin-top:.5em}
.chips i{display:inline-flex;align-items:center;gap:.35em;padding:.3em .8em;border-radius:20px;background:#fff;font-style:normal;font-weight:600;font-size:var(--f1);color:var(--brown);box-shadow:inset 0 0 0 1.5px #f3d7dd}
.chips i b{width:.9em;height:.9em;border-radius:50%}
.form{width:100%;display:flex;flex-direction:column;gap:.45em;margin-top:.5em;text-align:left}
.form input{width:100%;font:inherit;font-size:max(16px,var(--f2));padding:.55em .9em;border-radius:14px;border:2px solid #f6dce2;background:#fff;color:var(--brown);outline:none}
.form input:focus{border-color:var(--pink)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:.5em;width:100%;margin-top:.6em}
.nm{position:relative;padding:.6em .7em;border-radius:14px;background:#fff;text-align:left;box-shadow:0 4px 10px rgba(224,122,143,.15)}
.nm b{font-family:"Dancing Script";font-size:calc(var(--f3) * .9);color:var(--rose);line-height:1}
.nm p{font-size:var(--f1);color:var(--soft);font-style:italic;line-height:1.3}
.nm small{display:block;font-size:calc(var(--f1) * .92);color:var(--brown);font-weight:600;margin-top:.15em}
.like{position:absolute;right:.5em;top:.45em;border:0;background:none;cursor:pointer;font:inherit;font-weight:700;font-size:var(--f1);color:var(--pink);display:flex;align-items:center;gap:.2em;min-height:30px}
.like.on{animation:beat .6s}
.sub{font-weight:700;font-size:var(--f1);letter-spacing:.2em;color:var(--brown);margin-top:.8em;display:flex;justify-content:space-between;width:100%}
.sub span{color:var(--pink)}
.baby{width:min(56%,15em);margin:-.4em auto .1em}
.baby svg{width:100%;height:auto;overflow:visible}
.baby .moon{transform-origin:50% 60%;animation:rock 4s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.baby .tw{animation:twinkle 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.baby .z{animation:zz 3s ease-in infinite;opacity:0}
.baby .z2{animation-delay:1s}.baby .z3{animation-delay:2s}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-26px) scale(1.2)}}
.teddyend{font-size:2.6em;animation:beat 1.6s ease-in-out infinite;display:inline-block}

/* the balloon that carries each page away */
#flyer{position:fixed;left:0;top:0;z-index:12;pointer-events:none;width:clamp(120px,22vw,200px);opacity:0;will-change:transform}
#flyer img{width:100%;display:block}

/* navigation + controls */
.cue{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:8;font-weight:700;font-size:10px;letter-spacing:.3em;color:var(--rose);opacity:0;pointer-events:none;transition:opacity .6s;text-align:center}
.cue.show{opacity:1;pointer-events:auto;cursor:pointer}
.cue i{display:block;width:9px;height:9px;margin:2px auto 0;border-right:2px solid var(--rose);border-bottom:2px solid var(--rose);transform:rotate(45deg);animation:nudgeY 1.6s ease-in-out infinite}
.dots{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:8;display:flex;flex-direction:column;gap:10px;opacity:0;transition:opacity .6s}
.dots.show{opacity:1}
.dots button{width:12px;height:12px;border-radius:50%;border:2px solid var(--pink);background:#fff;cursor:pointer;padding:0}
.dots button[aria-current="true"]{background:var(--pink);transform:scale(1.2)}
@media (orientation:portrait){.dots{display:none}}
.ctrl{position:fixed;z-index:40;display:flex;gap:10px;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px))}
.ctrl button{font:inherit;color:var(--rose);background:rgba(255,255,255,.75);border:2px solid #f6c9d3;cursor:pointer}
#replay{opacity:0;pointer-events:none;transition:opacity .8s}#replay.show{opacity:1;pointer-events:auto}
/* ---------- controls: language, replay, sound ---------- */
.ib{width:44px;height:44px;padding:0!important;display:grid;place-items:center;border-radius:50%!important;position:relative;overflow:hidden}
.ib svg{width:22px;height:22px;fill:none;stroke:#fff3d6;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ib::after{content:"";position:absolute;inset:-1px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,220,150,.55) 85%,transparent);animation:ring 4s linear infinite;-webkit-mask:radial-gradient(circle,transparent 60%,#000 62%);mask:radial-gradient(circle,transparent 60%,#000 62%)}
@keyframes ring{to{transform:rotate(360deg)}}
#replay svg{transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
#replay:hover svg,#replay:focus-visible svg{transform:rotate(-360deg)}
#replay.spin svg{animation:spin .9s cubic-bezier(.4,0,.2,1)}
@keyframes spin{to{transform:rotate(-720deg)}}
#replay .dot{fill:#f3d58c;stroke:none;animation:breathe 2s ease-in-out infinite}
#snd .w1,#snd .w2{transition:opacity .4s,transform .4s;transform-origin:12px 12px}
#snd.on .w1{animation:wave 1.6s ease-in-out infinite}#snd.on .w2{animation:wave 1.6s ease-in-out .25s infinite}
@keyframes wave{0%,100%{opacity:.35}50%{opacity:1}}
#snd .x{stroke-dasharray:8;stroke-dashoffset:8;transition:stroke-dashoffset .45s;stroke:#ffb4a8}
#snd:not(.on) .x{stroke-dashoffset:0}#snd:not(.on) .w1,#snd:not(.on) .w2{opacity:0;transform:scale(.6)}
#snd .eqs{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);display:flex;gap:2px;align-items:flex-end;height:5px}
#snd .eqs i{width:2px;height:40%;background:#f3d58c;border-radius:1px}
#snd.on .eqs i{animation:eq .8s ease-in-out infinite}#snd.on .eqs i:nth-child(2){animation-delay:.2s}#snd.on .eqs i:nth-child(3){animation-delay:.4s}
#snd:not(.on) .eqs{opacity:0}
.langw{position:fixed;z-index:7;left:calc(14px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px))}
#langBtn{font:inherit;display:flex;align-items:center;gap:.5em;height:44px;padding:0 .9em 0 .35em;border-radius:40px;cursor:pointer;color:#fff5de;font-size:15px;
  background:linear-gradient(135deg,rgba(60,20,30,.55),rgba(28,15,6,.5));border:1px solid rgba(255,228,170,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.25)}
#langBtn:focus-visible,.langm button:focus-visible,.ib:focus-visible{outline:2px solid #ffd98a;outline-offset:3px}
.gly{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:#3a1a08;font-family:"Tiro Devanagari Hindi","Noto Serif Tamil","Noto Serif Telugu","Noto Serif Kannada","Noto Serif Malayalam","Noto Serif Bengali",serif;
  background:radial-gradient(circle at 35% 30%,#fff3cc,#e2b862 55%,#a8792f);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 10px rgba(240,200,110,.5)}
.gly.flip{animation:gflip .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes gflip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.chev{width:12px;height:12px;fill:none;stroke:#f3d58c;stroke-width:1.6;transition:transform .3s}
#langBtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.langm{position:absolute;left:0;top:52px;width:min(320px,calc(100vw - 28px));display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;border-radius:18px;
  background:linear-gradient(160deg,rgba(255,250,240,.97),rgba(250,236,210,.97));border:1px solid rgba(176,130,56,.5);box-shadow:0 18px 40px rgba(40,10,10,.35);
  opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top left;pointer-events:none;transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1)}
.langm.open{opacity:1;transform:none;pointer-events:auto}
.langm button{font:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:.5em .75em;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;color:#5b2f25;text-align:left;
  font-family:"Cormorant Garamond","Tiro Devanagari Hindi","Noto Serif Tamil","Noto Serif Telugu","Noto Serif Kannada","Noto Serif Malayalam","Noto Serif Bengali",serif;transition:background .25s,border-color .25s}
.langm button b{font-size:17px;font-weight:600}.langm button small{font-size:12px;font-style:italic;color:#9a6a55}
.langm button:hover{background:rgba(176,130,56,.12)}
.langm button[aria-checked="true"]{background:linear-gradient(160deg,#fff4dc,#efd29a);border-color:#b08238}
.langm .ttl{grid-column:1/-1;font-style:italic;font-size:13px;color:#8a5a4a;padding:0 .3em .2em}
@media (max-width:600px){#langName{display:none}#langBtn{padding:0 .5em 0 .35em}}
/* while flying between scenes, drop the costly frosted-glass blur so every frame stays light */
.zooming .glass,.zooming .ui3 *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.zooming .ui3 .glass{background:rgba(255,251,245,.9)}
.ib svg{stroke:var(--rose)!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>

     <div class="vote pop" ${D(.55)}><button class="vbtn boy" type="button" data-v="boy" aria-pressed="false">🍼 Team Boy</button><button class="vbtn girl" type="button" data-v="girl" aria-pressed="false">🎀 Team Girl</button></div>
     <div class="bars pop" ${D(.7)}><div class="bar b"><span>Team Boy</span><div class="tr"><div class="fl" id="fb"></div></div><span id="pb">0%</span></div><div class="bar g"><span>Team Girl</span><div class="tr"><div class="fl" id="fg"></div></div><span id="pgv">0%</span></div></div>
     <div class="txt soft pop" ${D(.8)} id="vnote" style="margin-top:.5em;font-size:var(--f1)"></div>`,
    `<div class="cap pop" ${D(.1)}>THE BIG DAY PLAN</div><div class="script s2 pop" ${D(.25)}>Celebration Schedule</div><div class="txt pop" ${D(.35)} style="font-size:var(--f1)">Here is how we will welcome the sweet adventure. Make sure not to miss the games!</div>
     <div class="sched">${CFG.schedule.map((s, i) => `<div class="ev pop" ${D(.5 + i * .15)}><div class="em">${s[0]}</div><div><div class="tm">${s[1]}</div><h4>${s[2]}</h4><p>${s[3]}</p></div></div>`).join("")}</div>`,
    `<div class="script s2 pop" ${D(.1)}>Venue &amp; Address</div><div class="txt pop" ${D(.25)} style="font-weight:700;font-size:var(--f3);font-family:Fredoka;color:var(--rose)">${CFG.venue.name}</div><div class="txt pop" ${D(.35)}>${CFG.venue.address}</div>
     <a class="btn pop" ${D(.45)} href="${CFG.venue.map}" target="_blank" rel="noopener">📍 Get Directions</a><div class="txt soft pop" ${D(.55)} style="font-size:var(--f1);margin-top:.4em">🚗 ${CFG.venue.note}</div>${SEP(.6)}
     <div class="script s3 pop" ${D(.7)}>Dress Code</div><div class="txt pop" ${D(.8)} style="font-weight:700">${CFG.dress}</div><div class="chips pop" ${D(.9)}>${CFG.palette.map(([n, c]) => `<i><b style="background:${c}"></b>${n}</i>`).join("")}</div>`,
    `<div class="cap pop" ${D(.1)}>NURSERY FUN</div><div class="script s2 pop" ${D(.2)}>Baby Name Suggestions</div><div class="txt pop" ${D(.3)} style="font-size:var(--f1)">Help the parents-to-be choose a beautiful name! Share your ideas and meanings below.</div>
     <form class="form pop" ${D(.4)} id="nf" onsubmit="return false"><input id="nfN" placeholder="Your Name" aria-label="Your Name" autocomplete="name"><input id="nfB" placeholder="Baby Name Idea" aria-label="Baby Name Idea"><input id="nfM" placeholder="Meaning / Blessings (Optional)" aria-label="Meaning or blessings, optional">
       <button class="btn" type="submit" id="nfS" style="align-self:center;margin-top:.3em">Submit Suggestion</button></form>
     <div class="sub pop" ${D(.5)}>SUGGESTION BOARD <span id="ncount"></span></div><div class="board pop" ${D(.6)} id="board"></div>`,
    `<span class="teddyend pop" ${D(.1)} aria-hidden="true">🧸</span><div class="script s1 pop" ${D(.25)}>${P[0]} &amp; ${P[1]}</div><div class="cap pop" ${D(.4)}>12 JULY 2026</div>${SEP(.5)}
     <div class="txt pop" ${D(.6)}>We can't wait to celebrate this sweet new beginning with you.</div><div class="vote pop" ${D(.75)}><button class="btn" id="share" type="button">💌 Share</button><button class="btn" id="again" type="button" style="background:linear-gradient(180deg,#9fd0f0,#6fb3e0);box-shadow:0 8px 18px rgba(80,150,210,.35)">🎈 Watch again</button></div>`
  ];
  $("#content").innerHTML = pages.map((h, i) => `<section class="pg" id="p${i}"><div class="in">${h}</div></section>`).join("");
  // voting
  if (!votes) votes = { ...CFG.votes };
  const paint = () => { const tot = votes.boy + votes.girl, b = Math.round(votes.boy / tot * 100); $("#fb").style.width = b + "%"; $("#fg").style.width = (100 - b) + "%"; $("#pb").textContent = b + "%"; $("#pgv").textContent = (100 - b) + "%";
    $("#vnote").textContent = myVote ? `You voted Team ${myVote === "boy" ? "Boy" : "Girl"}! ${tot} votes so far.` : `${tot} guests have voted so far.`; $$(".vbtn").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === myVote)); };
  $$(".vbtn").forEach(b => b.onclick = () => { if (myVote) votes[myVote]--; myVote = b.dataset.v; votes[myVote]++; store.set("votes", votes); store.set("myvote", myVote); paint(); const r = b.getBoundingClientRect(); burst(r.left + r.width / 2, r.top, 46); twinkle(); });
  paint();
  // names
  if (!names) names = CFG.names.map(n => ({ n: n[0], m: n[1], by: n[2], likes: n[3], liked: false }));
  const board = () => { $("#ncount").textContent = names.length + " Ideas";
    $("#board").innerHTML = names.map((x, i) => `<div class="nm"><b>${x.n}</b>${x.m ? `<p>"${x.m}"</p>` : ""}<small>— ${x.by}</small><button class="like${x.liked ? " on" : ""}" type="button" data-i="${i}" aria-label="Like ${x.n}" aria-pressed="${x.liked}">${x.liked ? "♥" : "♡"} ${x.likes}</button></div>`).join("");
    $$(".like").forEach(b => b.onclick = () => { const x = names[+b.dataset.i]; x.liked = !x.liked; x.likes += x.liked ? 1 : -1; store.set("names", names); board(); if (x.liked) { const r = b.getBoundingClientRect(); burst(r.left, r.top, 14); pop(); } }); };
  board();
  $("#nf").addEventListener("submit", () => { const n = $("#nfB").value.trim(), by = $("#nfN").value.trim() || "A guest"; if (!n) { $("#nfB").focus(); return; }
    names.unshift({ n: n[0].toUpperCase() + n.slice(1), m: $("#nfM").value.trim(), by, likes: 0, liked: false }); store.set("names", names); board(); $("#nfB").value = $("#nfM").value = ""; const r = $("#nfS").getBoundingClientRect(); burst(r.left + r.width / 2, r.top, 40); twinkle(); });
  $("#again").onclick = () => reset();
  $("#share").onclick = async e => { try { if (navigator.share) { await navigator.share({ title: `Baby shower of ${P[0]} & ${P[1]}`, url: location.href }); return; } await navigator.clipboard.writeText(location.href); e.currentTarget.textContent = "Link copied 💕"; } catch (_) {} };
}
function tickCountdown() { const el = $("#cdD"); if (!el) return; const ms = new Date(CFG.date) - Date.now(), s = Math.max(0, Math.floor(ms / 1000));
  const v = [Math.floor(s / 86400), Math.floor(s / 3600) % 24, Math.floor(s / 60) % 60, s % 60].map(x => String(x).padStart(2, "0"));
  ["cdD", "cdH", "cdM", "cdS"].forEach((id, i) => { if ($("#" + id).textContent !== v[i]) $("#" + id).textContent = v[i]; });
  $("#cdNote").textContent = ms > 0 ? "until we meet our little one" : "The sweet day is here! 💕"; }

/* ---------- moving between pages: a balloon bunch floats up and carries the page away ---------- */
let state = "door", page = 0, busy = false, cardOn = false;
function show(i) { const el = $("#p" + i); el.classList.remove("leave"); el.classList.add("vis"); el.classList.remove("on"); void el.offsetWidth; el.classList.add("on"); el.querySelector(".in").scrollTop = 0; }
function goPage(p) { if (state !== "card" || busy || p === page || p < 0 || p >= $$(".pg").length) return; busy = true;
  const old = $("#p" + page), fwd = p > page; old.classList.remove("on"); old.classList.add("leave");
  const f = $("#flyer"), r = $("#content").getBoundingClientRect(), H = innerHeight, x0 = r.left + r.width * (fwd ? .55 : .2), anim = f.animate([
      { transform: `translate(${x0}px,${H + 40}px) rotate(-6deg)`, opacity: 1 }, { transform: `translate(${x0 - 30}px,${H * .45}px) rotate(5deg)`, opacity: 1 }, { transform: `translate(${x0 + 20}px,${-H * .5}px) rotate(-4deg)`, opacity: 1 }],
    { duration: REDUCED ? 300 : 1900, easing: "cubic-bezier(.45,.05,.4,1)" });
  anim.onfinish = () => { f.style.opacity = 0; };
  Sound.whoosh && Sound.whoosh(); pop();
  setTimeout(() => { old.classList.remove("vis", "leave"); page = p; show(p); burst(r.left + r.width / 2, r.top + r.height * .45, 26); twinkle(); updateNav(); }, REDUCED ? 100 : 780);
  setTimeout(() => { busy = false; }, REDUCED ? 200 : 1300); }
function updateNav() { const ok = state === "card"; $("#cue").classList.toggle("show", ok && page < $$(".pg").length - 1); $("#dots").classList.toggle("show", ok); $$("#dots button").forEach(b => b.setAttribute("aria-current", +b.dataset.p === page)); $("#replay").classList.toggle("show", ok); }
$("#dots").innerHTML = ["Welcome", "Countdown", "Boy or girl", "Schedule", "Venue", "Baby names", "See you"].map((n, i) => `<button type="button" aria-label="${n}" data-p="${i}"></button>`).join("");
$$("#dots button").forEach(b => b.onclick = () => goPage(+b.dataset.p));
$("#cue").onclick = () => goPage(page + 1);
const inner = el => el && el.closest && el.closest(".pg .in");
const canScroll = (el, d) => { const s = inner(el); if (!s) return false; return d > 0 ? s.scrollTop + s.clientHeight < s.scrollHeight - 2 : s.scrollTop > 1; };
let acc = 0, accT = 0;
addEventListener("wheel", e => { if (state !== "card" || canScroll(e.target, Math.sign(e.deltaY))) return;
  const t = now(); if (t - accT > .4) acc = 0; accT = t; acc += e.deltaY; if (Math.abs(acc) > 50) { goPage(page + Math.sign(acc)); acc = 0; } }, { passive: true });
let ty = null, tT = null, tS = 0;
addEventListener("touchstart", e => { ty = e.touches[0].clientY; tT = e.target; const s = inner(tT); tS = s ? s.scrollTop : 0; }, { passive: true });
addEventListener("touchend", e => { if (ty == null) return; const dy = ty - e.changedTouches[0].clientY; ty = null; if (Math.abs(dy) < 50) return; 
  if (state !== "card" || (tT.closest && tT.closest("input"))) return; const s = inner(tT); if (s && (s.scrollTop !== tS || canScroll(tT, Math.sign(dy)))) return; goPage(page + Math.sign(dy)); }, { passive: true });
addEventListener("keydown", e => { if (e.target.closest && e.target.closest("input,button,a")) return; 
  if (state !== "card") return; if (["ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); goPage(page + 1); } if (["ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); goPage(page - 1); } });

/* ---------- opening the door ---------- */
function openDoor() { if (state !== "door") return; state = "opening"; Sound.init(); if (Sound.ctx && Sound.ctx.state === "suspended") Sound.ctx.resume();
  const b = $("#balloon"), r = b.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height * .35, 50); pop(); b.classList.add("fly");
  setTimeout(() => { $("#door").classList.add("open"); Sound.creak && Sound.creak(0, 2); twinkle(); Sound.pad(); }, 350);
  setTimeout(() => { $("#card").classList.add("show"); cardOn = true; show(0); burst(innerWidth / 2, innerHeight * .35, 70); }, 1500);
  setTimeout(() => { $("#door").style.transition = "opacity .9s"; $("#door").style.opacity = 0; }, 2000);
  setTimeout(() => { $("#door").style.visibility = "hidden"; state = "card"; updateNav(); }, 2900); }
$("#balloon").addEventListener("click", e => { e.stopPropagation(); openDoor(); });
$$("#balloon .hit").forEach(h => { h.addEventListener("click", e => { e.stopPropagation(); openDoor(); }); h.addEventListener("pointerenter", () => $("#balloon").classList.add("hover")); h.addEventListener("pointerleave", () => $("#balloon").classList.remove("hover")); });
// tapping anywhere else just makes the balloon wiggle, as if to say "here!"
$("#door").addEventListener("click", () => { if (state !== "door") return; const b = $("#balloon"); b.classList.remove("nudge"); void b.offsetWidth; b.classList.add("nudge"); setTimeout(() => b.classList.remove("nudge"), 650); Sound.init(); Sound.bell(1319, 0, .03, .3); });
$("#dTeddy").onclick = () => { const t = $("#dTeddy"); t.classList.remove("jump"); void t.offsetWidth; t.classList.add("jump"); setTimeout(() => t.classList.remove("jump"), 900); const r = t.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height * .2, 22); [784, 988, 1175, 988].forEach((f, i) => Sound.bell(f, i * .09, .035, .6)); };
function reset() { state = "door"; page = 0; busy = false; cardOn = false; $$(".pg").forEach(p => p.classList.remove("vis", "on", "leave")); $("#card").classList.remove("show");
  const d = $("#door"); d.classList.remove("open"); d.style.visibility = ""; d.style.opacity = ""; d.style.transition = ""; $("#balloon").classList.remove("fly"); Sound.stopPad(); updateNav(); }

let last = now();
function loop() { const t = now(), dt = Math.min(.05, t - last); last = t; drawSky(t, dt); tickCountdown(); requestAnimationFrame(loop); }
$("#snd").addEventListener("click", e => { Sound.init(); const on = Sound.toggle(), b = e.currentTarget; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); b.setAttribute("aria-label", on ? "Sound on" : "Sound off"); });
$("#replay").addEventListener("click", () => { const r = $("#replay"); r.classList.remove("spin"); void r.offsetWidth; r.classList.add("spin"); reset(); });
buildPages(); layout(); updateNav(); requestAnimationFrame(loop);
</script>
</body>
